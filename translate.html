<title>LIVE translate</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: -apple-system, sans-serif; background: #0f0f0f; color: #f0f0f0; display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

  /* 탭 */
  .tab-bar { display: flex; border-bottom: 0.5px solid #2a2a2a; flex-shrink: 0; background: #0f0f0f; }
  .tab { flex: 1; padding: 10px; font-size: 13px; font-weight: 500; text-align: center; color: #555; border: none; background: transparent; cursor: pointer; border-bottom: 2px solid transparent; -webkit-tap-highlight-color: transparent; }
  .tab.active { color: #0a84ff; border-bottom-color: #0a84ff; }

  /* 공통 */
  .page { display: none; flex: 1; flex-direction: column; overflow: hidden; min-height: 0; }
  .page.active { display: flex; }

  /* ── 번역 탭 컨트롤 바 (항상 표시) ── */
  .ctrl-bar { padding: 0.4rem 0.8rem; border-bottom: 0.5px solid #2a2a2a; display: flex; gap: 6px; align-items: center; flex-shrink: 0; background: #0f0f0f; }
  /* 버튼 묶음만 가로 스크롤. 설정 버튼(⚙️)은 이 영역 밖에 있어 항상 오른쪽에 보인다 */
  .ctrl-scroll { flex: 1; min-width: 0; display: flex; gap: 6px; align-items: center; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .ctrl-scroll::-webkit-scrollbar { display: none; }
  .ctrl-session { flex: 1; font-size: 12px; color: #555; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .ctrl-toggle { background: transparent; border: 0.5px solid #333; border-radius: 7px; color: #888; font-size: 14px; padding: 4px 8px; cursor: pointer; flex-shrink: 0; }
  .ctrl-toggle.open { color: #0a84ff; border-color: #0a84ff44; background: #0a84ff11; }
  .voice-toggle { background: transparent; border: 0.5px solid #333; border-radius: 7px; font-size: 14px; padding: 4px 8px; cursor: pointer; flex-shrink: 0; color: #888; }
  .voice-toggle.on { color: #30d158; border-color: #30d15844; background: #30d15811; }
  .mode-btn { font-size: 12px; padding: 4px 9px; border-radius: 7px; border: 0.5px solid #444; background: transparent; color: #888; cursor: pointer; flex-shrink: 0; white-space: nowrap; }
  .mode-btn.conv { background: #2a1a3a; color: #bf5fff; border-color: #bf5fff55; }
  .mute-btn { font-size: 14px; padding: 4px 8px; border-radius: 7px; border: 0.5px solid #333; background: transparent; color: #777; cursor: pointer; flex-shrink: 0; }
  .mute-btn.on { color: #30d158; border-color: #30d15844; background: #30d15811; }
  .refine-btn { font-size:12px; padding:4px 9px; border-radius:7px; border:0.5px solid #444; background:transparent; color:#888; cursor:pointer; flex-shrink:0; white-space:nowrap; }
  .refine-btn.on { color:#f0c674; border-color:#f0c67455; background:#f0c67411; }
  .manual-link { font-size:12px; padding:4px 9px; border-radius:7px; border:0.5px solid #444; background:transparent; color:#888; cursor:pointer; flex-shrink:0; white-space:nowrap; text-decoration:none; display:inline-flex; align-items:center; align-self:flex-end; }
  .manual-link:hover, .manual-link:active { color:#0a84ff; border-color:#0a84ff55; background:#0a84ff11; }
  .refine-tag { display:inline-block; font-size:9px; color:#f0c674; border:0.5px solid #f0c67455; border-radius:3px; padding:0 4px; margin-right:6px; vertical-align:1px; letter-spacing:0.04em; }
  .refining { opacity:0.75; }
  .conv-banner { padding: 6px 1rem; font-size: 12px; color: #bf5fff; background: #1a0d2a; border-bottom: 0.5px solid #bf5fff33; flex-shrink: 0; text-align: center; letter-spacing: 0.03em; }

  /* ── 접히는 설정 패널 ── */
  .settings { padding: 0.5rem 0.8rem; border-bottom: 0.5px solid #2a2a2a; display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; flex-shrink: 0; background: #131313; overflow: hidden; transition: max-height 0.2s ease, padding 0.2s ease; max-height: 200px; }
  .settings.collapsed { max-height: 0; padding-top: 0; padding-bottom: 0; border-bottom: none; }
  .sg { display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
  .sg label { font-size: 10px; color: #555; }
  input[type="password"], input[type="text"] { background: #1c1c1e; border: 0.5px solid #444; border-radius: 7px; color: #f0f0f0; font-size: 13px; padding: 5px 8px; outline: none; }
  input[type="password"] { width: 130px; }
  .session-input { width: 110px; }
  select { background: #1c1c1e; border: 0.5px solid #444; border-radius: 7px; color: #f0f0f0; font-size: 13px; padding: 5px 8px; outline: none; -webkit-appearance: none; max-width: 160px; }
  button { padding: 6px 12px; font-size: 13px; font-weight: 500; border-radius: 7px; border: none; cursor: pointer; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
  #startBtn { background: #0a84ff; color: #fff; }
  #startBtn:disabled { background: #1a3a5c; color: #555; }
  #stopBtn { background: transparent; color: #ff453a; border: 0.5px solid #ff453a; }
  #stopBtn:disabled { opacity: 0.3; }
  #clearBtn { background: transparent; color: #888; border: 0.5px solid #444; }

  .statusbar { padding: 4px 1rem; display: flex; align-items: center; gap: 7px; font-size: 11px; color: #555; border-bottom: 0.5px solid #1a1a1a; flex-shrink: 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #444; }
  .dot.connected { background: #30d158; }
  .dot.recording { background: #ff453a; animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  .err { color: #ff453a; margin-left: auto; font-size: 11px; }

  .translate-area { flex: 1; display: flex; overflow: hidden; min-height: 0; }
  .col { flex: 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  .col-header { padding: 6px 1rem 5px; font-size: 11px; color: #555; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; border-bottom: 0.5px solid #1a1a1a; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; }
  .copy-btn { font-size: 11px; color: #0a84ff; background: transparent; border: 0.5px solid #0a84ff44; border-radius: 5px; padding: 2px 8px; cursor: pointer; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .copy-btn.copied { color: #30d158; border-color: #30d15844; }
  .col-body { flex: 1; overflow-y: auto; padding: 0.8rem 1rem; -webkit-overflow-scrolling: touch; min-height: 0; }
  .divider { width: 0.5px; background: #222; flex-shrink: 0; }
  .para { margin-bottom: 14px; }
  .para .ts { display: block; font-size: 10px; color: #3a3a3a; margin-bottom: 3px; }
  .para .pt { font-size: 15px; line-height: 1.75; color: #e0e0e0; word-break: break-word; }
  .para.ko .pt { color: #d0ecd0; }
  .para.fo .pt { color: #a9cbff; }
  .para .pt { font-size: var(--pt-size, 15px); }
  .seg-card { border:0.5px solid #262626; border-radius:10px; padding:0.7rem 0.85rem; margin-bottom:12px; background:#151515; }
  .seg-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; padding-bottom:6px; border-bottom:0.5px solid #222; }
  .seg-no { font-size:10px; color:#888; background:#242424; border-radius:4px; padding:2px 7px; letter-spacing:0.03em; }
  .seg-time { font-size:10px; color:#4a4a4a; font-variant-numeric:tabular-nums; }
  .seg-part { margin-bottom:8px; }
  .seg-part:last-child { margin-bottom:0; }
  .seg-label { font-size:9px; color:#5a5a5a; letter-spacing:0.1em; margin-bottom:3px; }
  .seg-card .para { margin-bottom:4px; }
  .seg-card .para .ts { display:none; }
  .lang-tag { display:inline-block; font-size:9px; color:#7a7a7a; border:0.5px solid #3a3a3a; border-radius:3px; padding:0 4px; margin-right:6px; vertical-align:1px; letter-spacing:0.05em; }
  .elapsed { font-size: 11px; color: #666; font-variant-numeric: tabular-nums; }

<script>
// ══════════════════════════════════════
// 상태 변수
// ══════════════════════════════════════
let ws=null, stream=null, actx=null, proc=null;
let ws2=null; // 대화 모드 역방향 세션
let convMode = false;   // false=회의모드, true=대화모드
let muted = true;   // 기본은 음소거 (회의 모드 = 텍스트만)
let audioQueue = [];
let isPlayingAudio = false;
const SR=16000;

// ── 사용 기록(익명) ──
// 개인 식별 정보는 전혀 보내지 않는다. 기록되는 건 무작위 기기 ID, 앱 종류,
// 모드, 언어 조합, 시간뿐이다. Google Apps Script 웹훅으로 시트에 쌓인다.
const USAGE_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycby-uxXJ58wufxgNxXPWlGf4cxr9iaICGYeyo51EhMOXdakIdXub5KkED9q0aUNtmoCOjA/exec';
let usageSessionId = null;

function getDeviceId(){
  let id = localStorage.getItem('gt_deviceId');
  if(!id){
    id = 'd_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    localStorage.setItem('gt_deviceId', id);
  }
  return id;
}

// no-cors + text/plain: Apps Script는 CORS preflight(OPTIONS)를 못 받으므로,
// 프리플라이트 자체가 안 생기는 방식으로 보낸다. 응답은 못 읽지만 기록 목적엔 충분하다.
function sendUsageEvent(action, extra){
  if(!USAGE_WEBHOOK_URL) return;
  try{
    const payload = Object.assign({
      action, sessionId: usageSessionId, deviceId: getDeviceId(),
    }, extra||{});
    fetch(USAGE_WEBHOOK_URL, {
      method:'POST', mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
    }).catch(()=>{});
  }catch(_){}
}
const PLAYBACK_SR=24000;
const langName={ko:'한국어',en:'영어',ja:'일본어',zh:'중국어',es:'스페인어',de:'독일어',fr:'프랑스어'};
const PARA_GAP=2500;

// 현재 세션 데이터
let currentSession = null; // {name, startTime, lang, src:[], dst:[]}
let modalSession = null;   // 모달에서 보고 있는 저장된 세션

// ══════════════════════════════════════
// 탭 전환
// ══════════════════════════════════════
function switchTab(tab) {

  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));

}

// ══════════════════════════════════════
// 번역 핵심 로직
// ══════════════════════════════════════
function setStatus(t,txt){document.getElementById('dot').className='dot'+(t?' '+t:'');document.getElementById('statusText').textContent=txt;}
function showErr(m){document.getElementById('err').textContent=m;}

function clearAll(){
  if(currentSession && (currentSession.src.length||currentSession.dst.length)){
    if(!confirm('현재 화면의 번역 내용을 지웁니다.\n(저장된 회의록은 삭제되지 않습니다)')) return;
  }
  document.getElementById('srcBox').innerHTML='';
  document.getElementById('dstBox').innerHTML='';
  if(segSilenceT){clearTimeout(segSilenceT);segSilenceT=null;}
  segId=0; segLang=''; segChars=0; dstSeg=0; dstPrevEnded=true;
  pendingCandidateLen=null; pendingSince=null;
  pendingSilenceBreak=false; lastSrcEndedSentence=true;
  showErr('');
  currentSession=null;
  updateCurrentCard();
  updateCtrlSession();
}

function ts(){return new Date().toTimeString().slice(0,8);}

// 세션의 lang 문자열('ko|en','conv|en','ko|auto')을 사람이 읽는 표기로 변환
function langPairLabel(langStr){
  const parts=(langStr||'ko|auto').split('|');
  if(parts[0]==='conv'){
    const [,A,B] = parts;   // 'conv|A|B' — 예전 'conv|B'(내 언어=한국어 가정) 형식도 함께 지원
    if(B===undefined) return '한국어 ↔ '+(langName[A]||A)+' (대화)';
    return (langName[A]||A)+' ↔ '+(langName[B]||B)+' (대화)';
  }
  const[a,b]=parts;
  const s = b==='auto' ? '자동감지' : (langName[b]||b);
  return s+' → '+(langName[a]||a);
}
function dateStr(){return new Date().toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});}

// 텍스트의 문자 종류로 언어를 판정한다.
// 자동감지 회의에서 언어가 바뀌면 발언자가 바뀐 것으로 보고 문단을 나눈다.
function detectScript(s){
  if(!s) return '';
  let ko=0, ja=0, zh=0, la=0;
  for(const ch of s){
    const c=ch.codePointAt(0);
    if((c>=0xAC00&&c<=0xD7AF)||(c>=0x1100&&c<=0x11FF)||(c>=0x3130&&c<=0x318F)) ko++;
    else if((c>=0x3040&&c<=0x309F)||(c>=0x30A0&&c<=0x30FF)) ja++;   // 가나
    else if(c>=0x4E00&&c<=0x9FFF) zh++;                              // 한자
    else if((c>=0x41&&c<=0x5A)||(c>=0x61&&c<=0x7A)) la++;
  }
  // 글자 수 비교가 아니라 우선순위로 판정한다.
  // 한국어·중국어 화자는 영어 단어를 섞어 쓰지만("그래서 investors Yes"),
  // 영어 화자가 한글이나 한자를 말하는 일은 없기 때문이다.
  if(ja>0) return 'ja';            // 가나가 있으면 일본어 확정
  if(ko>0) return 'ko';
  if(zh>0) return 'zh';
  if(la>=3) return 'en';           // 짧은 조각("to")은 보류해 문단을 끊지 않음
  return '';                       // 판정 보류 → 현재 문단 유지
}
const scriptTag={ko:'KO', en:'EN', zh:'ZH', ja:'JA'};

// 사용자가 위로 스크롤해 읽는 중이면 자동 스크롤을 멈춤
function isNearBottom(el){ return (el.scrollHeight - el.scrollTop - el.clientHeight) < 80; }

// groupKey: 같은 묶음인지 판단하는 키(감지된 언어 또는 출력 방향).
// 침묵 2.5초 외에도 이 키가 바뀌면 문단을 나눈다.
// ══════════════════════════════════════
// 사후 번역 보정 — 완결된 문단을 텍스트 모델로 다시 번역해 교체
// ══════════════════════════════════════
function scheduleRefine(seg){
  if(!refineOn || convMode) return;
  if(refinedSegs.has(seg)) return;
  refinedSegs.add(seg);
  refineQueue.push(seg);
  setTimeout(runRefineQueue, 1500);   // 늦게 도착하는 조각을 기다린다
}

// 아직 다듬지 않은 문단을 모두 찾아 큐에 넣는다.
// 중지 시점에 큐가 덜 비었거나 API 호출이 실패했던 문단도 여기서 다시 챙긴다.
function refinePendingAll(){
  if(!refineOn || convMode || !currentSession) return 0;
  const keys = new Set();
  (currentSession.src||[]).forEach(x=>{ if(x.seg!=null) keys.add(String(x.seg)); });
  let queued = 0;
  [...keys].sort((a,b)=>Number(a)-Number(b)).forEach(k=>{
    const dst = (currentSession.dst||[]).filter(d=>String(d.seg)===k);
    if(!dst.length) return;                       // 번역이 없는 문단은 대상이 아니다
    if(dst.every(d=>d.refined)) return;           // 이미 다듬어진 문단은 건너뛴다
    refinedSegs.delete(Number(k));                // 실패했던 문단도 다시 시도할 수 있게
    scheduleRefine(Number(k));
    queued++;
  });
  return queued;
}

async function runRefineQueue(){
  if(refineBusy || !refineQueue.length) return;
  refineBusy = true;
  const seg = refineQueue.shift();
  try{ await refineSegment(seg); }catch(_){}
  refineBusy = false;
  if(refineQueue.length) setTimeout(runRefineQueue, 250);
}

function segTexts(seg){
  const key=String(seg);
  const src=(currentSession?.src||[]).filter(x=>String(x.seg)===key);
  const dst=(currentSession?.dst||[]).filter(x=>String(x.seg)===key);
  return { key, src, dst,
    srcTxt: src.map(x=>x.text).join(' ').trim(),
    dstTxt: dst.map(x=>x.text).join(' ').trim() };
}

async function refineSegment(seg){
  if(!currentSession) return;
  const apiKey=document.getElementById('apiKey').value.trim();
  if(!apiKey) return;

  const t=segTexts(seg);
  if(t.srcTxt.length < 40 || !t.dstTxt) return;   // 너무 짧으면 보정 이득이 없다

  const tgt = (currentSession.lang||'ko|auto').split('|')[0];
  const tgtName = langName[tgt] || '한국어';

  const prompt =
    '아래는 회의 실시간 통역 결과다. 원문 전체 맥락을 보고 번역을 정확하고 자연스럽게 다듬어라.\n\n'
    + '규칙:\n'
    + '- 숫자, 비율, 금액, 날짜는 원문 그대로 유지한다. 임의로 바꾸거나 추측하지 않는다.\n'
    + '- 실시간 번역이 어순이나 부정을 잘못 처리한 부분을 원문에 맞게 바로잡는다.\n'
    + '- 원문에 없는 내용을 새로 만들지 않는다. 불확실하면 원래 번역을 유지한다.\n'
    + '- 설명·머리말·따옴표 없이 다듬은 ' + tgtName + ' 번역문만 출력한다.\n\n'
    + '[원문]\n' + t.srcTxt.slice(0,4000) + '\n\n'
    + '[실시간 번역]\n' + t.dstTxt.slice(0,4000);

  const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+apiKey,{
    method:'POST', headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{ temperature:0.2 }
    })
  });
  if(!res.ok) return;
  const data = await res.json();
  let out = (data.candidates?.[0]?.content?.parts?.[0]?.text || '').trim();
  if(!out) return;
  out = out.replace(/^```[a-z]*\s*/i,'').replace(/```$/,'').trim();

  // 결과가 비정상적으로 짧거나 길면 신뢰하지 않고 원래 번역을 유지한다
  if(out.length < t.dstTxt.length*0.4 || out.length > t.dstTxt.length*3) return;

  applyRefined(t, out);
}

function applyRefined(t, refined){
  // 화면 갱신 — 해당 문단의 번역 조각들을 하나로 합쳐 교체
  const box=document.getElementById('dstBox');
  const paras=[...box.querySelectorAll('.para')].filter(p=>p.dataset.gk===t.key);
  if(paras.length){
    const first=paras[0];
    first.querySelector('.pt').textContent = refined;
    if(!first.querySelector('.refine-tag')){
      const tag=document.createElement('span');
      tag.className='refine-tag'; tag.textContent='다듬음';
      first.insertBefore(tag, first.querySelector('.pt'));
    }
    paras.slice(1).forEach(p=>p.remove());
  }
  // 저장 데이터 갱신 — 회의록·요약·다운로드에 반영
  if(t.dst.length && currentSession){
    const keep=t.dst[0];
    keep.text=refined; keep.refined=true;
    currentSession.dst = currentSession.dst.filter(x=>String(x.seg)!==t.key || x===keep);
  }
}

// ══════════════════════════════════════
// 문단 관리 — 원문/번역이 같은 문단번호(segId)를 공유한다.
// 이렇게 해야 좌우 화면이 동시에 나뉘고 회의록에서 원문·번역이 정확히 짝지어진다.
// 문단이 바뀌는 조건: (1) 침묵 2.5초  (2) 원문 언어 변경(발언자 전환)  (3) 길이 초과
// ══════════════════════════════════════
let segId = 0;
let segSilenceT = null;
let segLang = '';     // 현재 문단의 원문 언어
let segChars = 0;     // 현재 문단 누적 글자 수
const SEG_SOFT_CHARS = 600;      // 이 길이를 넘으면 분리 후보를 찾기 시작한다
const SEG_LOOKAHEAD_CHARS = 80;  // 첫 후보 이후 이만큼 더 보고 나서 분리 여부를 정한다
const SEG_HARD_CHARS = 1500;     // 문장 부호가 계속 없으면 이 길이에서 강제 분리

// 소프트 한도를 넘긴 뒤 발견한 "문장이 끝나는 지점" 후보.
// 곧바로 자르지 않고, 다음에 들어오는 말이 화제를 이어가는지 바꾸는지 보고 나서 정한다.
// 서버 메시지 처리 중 예외가 나면 지금까지는 catch(_){}로 조용히 삼켜져
// "소켓은 열려 있는데 아무 반응이 없다"는 현상의 원인을 알 수 없었다.
// 이제 마지막 오류를 기록해 진단 줄에 그대로 노출한다.
let lastParseError = null;
let lastParseErrorAt = 0;
// 클라이언트 쪽은 전부 정상인데 기능이 안 되면, 서버가 애초에 오디오를
// 안 보내고 있는지 직접 세어보는 수밖에 없다. ws/ws2 각각 텍스트·오디오·턴종료 수신 횟수.
const rxCount = { ws:{text:0, audio:0, turn:0}, ws2:{text:0, audio:0, turn:0} };

let pendingCandidateLen = null;  // 가장 최근 후보 지점의 누적 글자수
let pendingSince = null;         // 첫 후보가 나온 시점의 누적 글자수(여유분 측정 기준)

// 침묵으로 문단을 끊으려 했지만 문장이 아직 안 끝난 경우, 문장이 끝날 때까지 미룬다.
// 이 처리가 없으면 발화 중간의 짧은 멈춤에서 문장이 두 문단으로 쪼개진다.
let pendingSilenceBreak = false;
let lastSrcEndedSentence = true;

// 새 발언이 화제를 바꾸는지/이어가는지 앞부분 단어로 가늠한다.
// 확신이 없는 대부분의 경우는 null을 반환해 안전하게 "여유분 소진" 규칙으로 넘긴다.
const CUE_SHIFT = [
  '그리고 나서','그다음으로','다음으로','한편,','한편 ','자 그럼','그럼 이제',
  '참고로 말씀드리면','추가로 말씀드리면','질문 하나 더','다른 질문','다음 질문','또 다른',
  '화제를 바꿔서','다른 얘기로',
  'so,','now,','next,','moving on','one more thing','by the way','also,','additionally,',
  'switching to','another question',
];
const CUE_CONTINUE = [
  '그리고','그래서','하지만','그런데','근데','왜냐하면','즉','다시 말해','게다가','또한',
  'and ','but ','so ','because ','however,','also ','moreover,','in addition,',
];
function classifyCue(text){
  const t = String(text||'').trim();
  const tl = t.toLowerCase();
  for(const c of CUE_SHIFT){ if(t.startsWith(c) || tl.startsWith(c.toLowerCase())) return 'shift'; }
  for(const c of CUE_CONTINUE){ if(t.startsWith(c) || tl.startsWith(c.toLowerCase())) return 'continue'; }
  return null;
}

// 번역문은 원문보다 늦게 도착한다. 원문이 문단을 넘겨도
// 번역이 문장을 끝낼 때까지 기다렸다가 따라 넘어가게 한다.
let dstSeg = 0;
let dstPrevEnded = true;

// ── 사후 번역 보정 ──
// 실시간 통역은 문장이 끝나기 전에 번역을 내보내므로 어순·부정·중의어에서 오류가 난다.
// 문단이 완결되면 원문 전체를 다시 보내 정확한 번역으로 교체한다.
let refineOn = true;
const refinedSegs = new Set();
let refineQueue = [];
let meetingRollingSummary = '';   // 발언 추천용 롤링 요약 — 매번 전체를 다시 안 보내기 위한 누적 요약
let suggestSegCount = 0;          // 지금까지 롤링 요약에 반영된 문단 수(이후만 "새 내용"으로 취급)
let suggestHistory = [];          // 이번 세션에서 받은 추천 발언 전부 — 최신이 위로, 이전 것도 계속 보임
let refineBusy = false;

// 문장이 끝났는지 판정 — 영어·한국어(. ! ?)와 중국어·일본어(。！？)를 함께 본다.
// 뒤에 붙는 인용부호나 괄호도 문장 끝으로 인정한다.
function endsSentence(t){
  return /[.!?。！？…]["'\u201D\u2019)\]\u3011\u300D\u300F]*\s*$/.test(String(t).trim());
}

function bumpSegment(){
  const finished = segId;      // 지금 떠나는 문단은 완결된 것
  segId++; segLang=''; segChars=0;
  pendingCandidateLen=null; pendingSince=null;
  pendingSilenceBreak=false; lastSrcEndedSentence=true;
  if(refineOn && !convMode) scheduleRefine(finished);
}

// 말이 2.5초 이상 끊겼을 때. 문장이 완결된 상태라면 바로 나누고,
// 문장 중간이라면 다음에 문장이 끝나는 시점까지 분리를 미룬다.
function onSilenceTimeout(){
  segSilenceT = null;
  if(lastSrcEndedSentence) bumpSegment();
  else pendingSilenceBreak = true;
}

// 원문이 도착할 때 호출해 문단 전환 여부를 판단한다.
// 우선순위: ① 발언자가 바뀐 경우(언어 전환) 즉시 분리
//          ② 그 외엔 대기 중인 후보가 있을 때만, 지금 들어온 말이
//             화제를 바꾸는지(즉시 분리) / 이어가는지(계속 대기) 판단
function noteSource(text){
  const lang = detectScript(text);
  if(lang && segLang && lang !== segLang){
    bumpSegment();   // 발언자 전환 — 최우선, 즉시 분리
  } else if(pendingCandidateLen!=null){
    const cue = classifyCue(text);
    if(cue==='shift' || (segChars - pendingSince) >= SEG_LOOKAHEAD_CHARS){
      // 분리하기로 결정했다. 그런데 그 사이(후보 지점 이후) 새로운 문장이
      // 이미 시작돼 아직 안 끝난 상태라면, 지금 자르면 그 문장이 두 문단으로
      // 쪼개진다. 침묵 분리와 같은 방식으로 — 지금 당장 자르지 않고
      // 문장이 끝날 때까지 미룬다.
      if(lastSrcEndedSentence) bumpSegment();
      else pendingSilenceBreak = true;
    }
    // cue==='continue' 이거나 아직 여유분이 남아있으면 같은 문단에 계속 이어붙인다
  }
  if(lang && !segLang) segLang = lang;

  if(segSilenceT) clearTimeout(segSilenceT);
  segSilenceT = setTimeout(onSilenceTimeout, PARA_GAP);

  const before = segId;
  segChars += text.length;
  return { lang, seg: before };
}

// 텍스트를 붙인 뒤 이 문단이 분리 후보를 남겼는지, 강제 분리 한도를 넘었는지 기록한다.
// 실제 분리는 여기서 하지 않고 noteSource가 다음 청크를 볼 때 판단한다 —
// 그래야 "몇 글자 더 보고 나서 정한다"가 정확히 청크 경계에서 이루어진다.
function noteSourceAfter(lastText){
  lastSrcEndedSentence = endsSentence(lastText);

  // 침묵으로 미뤄둔 분리가 있고 이제 문장이 끝났다면, 이 문장까지 담고 나눈다
  if(pendingSilenceBreak && lastSrcEndedSentence){
    pendingSilenceBreak = false;
    bumpSegment();
    return;
  }

  if(segChars <= SEG_SOFT_CHARS){ pendingCandidateLen=null; pendingSince=null; return; }
  if(lastSrcEndedSentence){
    if(pendingCandidateLen===null) pendingSince = segChars;
    pendingCandidateLen = segChars;
  }
  if(segChars > SEG_HARD_CHARS){
    bumpSegment();   // 안전장치: 문장 부호 없이 계속 이어지면 강제 분리
  }
}

// 번역문 추가 — 문장을 끝낸 뒤에만 문단번호를 따라간다.
// wantSeg: 같은 메시지의 원문이 쓴 문단번호. 이걸 넘겨받아야 좌우가 한 조각도 밀리지 않는다.
function appendDstText(text, cls, storeArr, wantSeg){
  const target = (wantSeg!=null) ? Number(wantSeg) : segId;
  // 뒤로는 절대 가지 않고, 문장을 끝냈거나 2문단 이상 뒤처졌을 때만 앞으로 이동
  if(target > dstSeg && (dstPrevEnded || (target - dstSeg) >= 2)) dstSeg = target;
  appendText('dstBox', text, cls, storeArr, dstSeg, '');
  dstPrevEnded = endsSentence(text);
}

// 화면에 유지할 문단 수 상한. 넘으면 오래된 것을 화면에서만 정리한다.
// 회의록 데이터(currentSession)는 그대로 보존되므로 기록은 손실되지 않는다.
const MAX_DOM_PARAS = 400;

function trimBox(box){
  const paras=box.querySelectorAll('.para');
  const excess=paras.length-MAX_DOM_PARAS;
  if(excess<=0) return;
  if(!box.querySelector('.trim-note')){
    const n=document.createElement('div');
    n.className='trim-note';
    n.textContent='앞부분 문단은 화면에서만 정리했습니다. 회의록에는 전부 남아 있습니다.';
    box.insertBefore(n, box.firstChild);
  }
  for(let i=0;i<excess;i++) if(paras[i]) paras[i].remove();
}

function appendText(boxId, text, cls, storeArr, segKey, tagLang){
  if(!text||!text.trim())return;
  const box=document.getElementById(boxId);
  const stick=isNearBottom(box);        // 추가 전에 위치 판단
  const key=String(segKey);
  const last=box.lastElementChild;

  if(last && last.dataset.gk===key){
    last.querySelector('.pt').textContent+=' '+text.trim();
    if(storeArr&&storeArr.length) storeArr[storeArr.length-1].text+=' '+text.trim();
  } else {
    const p=document.createElement('div');
    p.className='para'+(cls?' '+cls:'');
    p.dataset.gk=key;
    const tsEl=document.createElement('span'); tsEl.className='ts'; tsEl.textContent=ts();
    p.appendChild(tsEl);
    if(scriptTag[tagLang]){
      const tg=document.createElement('span'); tg.className='lang-tag'; tg.textContent=scriptTag[tagLang];
      p.appendChild(tg);
    }
    const ptEl=document.createElement('span'); ptEl.className='pt'; ptEl.textContent=text.trim();
    p.appendChild(ptEl);
    box.appendChild(p);
    if(storeArr) storeArr.push({seg:key, time:ts(), text:text.trim(), lang:tagLang||''});
  }
  trimBox(box);
  if(stick) box.scrollTop=box.scrollHeight;
}

// ── 글자 크기 ──
function applyFont(px){
  document.documentElement.style.setProperty('--pt-size', px+'px');
  localStorage.setItem('gt_fontsize', String(px));
}
function adjustFont(delta){
  const cur=parseInt(localStorage.getItem('gt_fontsize')||'15',10);
  applyFont(Math.max(11, Math.min(26, cur+delta)));
}

// ── 화면 꺼짐 방지 (회의 중 세션 끊김 예방) ──
let wakeLock=null;
async function acquireWakeLock(){
  try{
    if('wakeLock' in navigator){
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', ()=>{ wakeLock=null; });
    }
  }catch(_){ wakeLock=null; }
}
function releaseWakeLock(){ try{ wakeLock&&wakeLock.release(); }catch(_){} wakeLock=null; }
// 앱이 다시 포그라운드로 오면 재획득
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && ws && ws.readyState===1 && !wakeLock) acquireWakeLock();
});

// ── 저장 용량 감시 ──
// Safari의 사이트당 저장 한도는 약 5MB. 한도를 넘으면 저장이 실패하므로 미리 경고한다.
// 5MB는 가정값이다. 저장이 한 번 실패하면 그 순간의 실제 사용량을
// 진짜 한도로 학습해 이후 퍼센트를 정확하게 만든다.
const QUOTA_DEFAULT = 5*1024*1024;
const QUOTA_MIN_LEARN = 512*1024;   // 이보다 작으면 용량 문제가 아니라고 판단
let learnedQuota = 0;               // 메모리 캐시 (저장 자체가 막힌 경우 대비)

function quotaBytes(){
  if(learnedQuota >= QUOTA_MIN_LEARN) return learnedQuota;
  let v=0;
  try{ v=parseInt(localStorage.getItem('gt_quota')||'0',10); }catch(_){}
  if(v >= QUOTA_MIN_LEARN){ learnedQuota=v; return v; }
  return QUOTA_DEFAULT;
}

function isQuotaLearned(){ return quotaBytes() !== QUOTA_DEFAULT; }

// 저장이 실패한 시점에 들어 있는 양은 '확실히 들어가는 크기'다.
// 이 값을 한도로 삼으면 이후 경고 시점이 실제와 맞는다.
function learnQuota(){
  const used = storageUsedBytes();
  if(used < QUOTA_MIN_LEARN) return null;   // 시크릿 모드·저장 차단 등 다른 원인
  if(used > learnedQuota) learnedQuota = used;
  try{
    const prev=parseInt(localStorage.getItem('gt_quota')||'0',10);
    if(used > prev) localStorage.setItem('gt_quota', String(used));
  }catch(_){}                                // 작은 키조차 못 쓰면 메모리 캐시만 사용
  return learnedQuota;
}

function storageUsedBytes(){
  let n=0;
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      n += k.length + (localStorage.getItem(k)||'').length;
    }
  }catch(_){}
  return n*2;   // UTF-16 기준 근사치
}

function storagePct(){ return Math.min(100, Math.round(storageUsedBytes()/quotaBytes()*100)); }

function checkStorage(){
  const pct=storagePct();
  updateStorageLabel(pct);
  if(pct>=90){
    const act = (currentSession && (currentSession.src.length||currentSession.dst.length))
      ? { label:'지금 다운로드', fn:()=>downloadCurrent() } : null;
    showNotice('저장 공간이 '+pct+'% 찼습니다. 회의록을 다운로드하고 오래된 기록을 삭제해 주세요.', 'danger', act);
  } else if(pct>=70){
    showNotice('저장 공간 '+pct+'% 사용 중입니다. 오래된 회의록을 정리하는 것이 좋습니다.', 'warn');
  }
  return pct;
}

function updateStorageLabel(pct){
  const el=document.getElementById('storageLabel');
  if(!el) return;
  const v = (pct==null) ? storagePct() : pct;
  const mb = (quotaBytes()/1024/1024);
  const basis = isQuotaLearned()
    ? ('실측 '+(Math.round(mb*10)/10)+'MB')
    : (Math.round(mb)+'MB 기준');
  el.textContent='저장 공간 '+v+'% · '+basis;
  el.style.color = v>=90 ? '#ff453a' : (v>=70 ? '#f0c674' : '#555');
}

// ── 공용 안내 배너 ──
let noticeActionFn=null;
function runNoticeAction(){ if(noticeActionFn) noticeActionFn(); }

// action: {label, fn} — 경고만 띄우지 않고 바로 조치할 수 있게 한다
function showNotice(text, kind, action){
  const b=document.getElementById('noticeBanner');
  if(!b) return;
  b.className='notice-banner '+(kind||'info');
  b.querySelector('.notice-text').textContent=text;
  const btn=document.getElementById('noticeAction');
  if(action && btn){
    btn.textContent=action.label;
    btn.classList.remove('hidden');
    noticeActionFn=action.fn;
  } else if(btn){
    btn.classList.add('hidden');
    noticeActionFn=null;
  }
  b.classList.remove('hidden');
}
function hideNotice(){
  const b=document.getElementById('noticeBanner');
  if(b) b.classList.add('hidden');
  noticeActionFn=null;
}

// ── 대화 모드 상태 표시 ──
// 디버깅 과정에서 쌓인 세부 진단(수신 카운트, 마이크 게이트 상태 등)은
// 문제가 해결되어 더 이상 필요 없으므로, 연결 상태와 오류만 남긴다.
function updateConvDiag(){
  const el = document.getElementById('convDiag');
  if(!el) return;
  if(!convMode){ el.textContent=''; return; }
  const la = document.getElementById('langA')?.value || 'ko';
  const lb = document.getElementById('langB')?.value || 'en';
  const aname = langName[la]||la, bname = langName[lb]||lb;
  const up = (ws && ws.readyState===1) ? '✓' : '✕';
  const dn = (ws2 && ws2.readyState===1) ? '✓' : '✕';
  const errRecent = lastParseError && (Date.now()-lastParseErrorAt) < 10000;
  const errTag = errRecent ? (' · ⚠ '+lastParseError) : '';
  el.textContent = aname+'→'+bname+' '+up+' / '+bname+'→'+aname+' '+dn+errTag;
  el.style.color = (up!=='✓' || dn!=='✓' || errRecent) ? '#f0c674' : '#4a7a4a';
  if(errRecent) el.style.color = '#ff453a';
}

// ── 경과 시간 ──
let elapsedInt=null, startedAt=0;
let longNoticeShown=false;
let silentNoticeShown=false;

// ── 주기적 자동 저장 ──
// 중지 시점에만 저장하면 긴 회의 중 페이지가 죽었을 때 전부 잃는다.
let autoSaveInt=null;
const AUTOSAVE_MS = 5*60*1000;   // 5분

function startAutoSave(){
  clearInterval(autoSaveInt);
  autoSaveInt=setInterval(()=>{
    if(usageSessionId) sendUsageEvent('heartbeat');
    if(!currentSession) return;
    if(!currentSession.src.length && !currentSession.dst.length) return;
    // durationSec 본값은 중지 시에만 확정한다. 자동 저장에는 지금까지의
    // 진행 시간을 실은 스냅샷만 저장해, 다음 자동 저장 때 중복 합산되지 않게 한다.
    const snapshot = {...currentSession, durationSec: getCurrentDurationSec(currentSession)};
    if(upsertSession(snapshot)){
      showSaveHint('자동 저장 ' + new Date().toTimeString().slice(0,5));
      checkStorage();
    }
  }, AUTOSAVE_MS);
}
function stopAutoSave(){ clearInterval(autoSaveInt); autoSaveInt=null; }

function showSaveHint(text){
  const el=document.getElementById('saveHint');
  if(!el) return;
  el.textContent='💾 '+text;
  el.style.opacity='1';
  setTimeout(()=>{ el.style.opacity='0.35'; }, 2500);
}
function startElapsed(){
  startedAt=Date.now();
  clearInterval(elapsedInt);
  elapsedInt=setInterval(()=>{
    const s=Math.floor((Date.now()-startedAt)/1000);
    const mm=String(Math.floor(s/60)%60).padStart(2,'0'), ss=String(s%60).padStart(2,'0');
    const el=document.getElementById('elapsed');
    if(el) el.textContent=(s>=3600? Math.floor(s/3600)+':' : '')+mm+':'+ss;
    // 마이크/재생 컨텍스트가 정지 상태로 빠졌는지 매초 확인해 즉시 되살린다.
    // iOS는 두 컨텍스트가 동시에 있을 때 한쪽을 조용히 정지시키는 경우가 있는데,
    // 이 감시가 없으면 화면엔 아무 표시 없이 마이크만 영구히 죽는다.
    if(actx && actx.state==='suspended'){
      try{ actx.resume(); }catch(_){}
      showNotice('마이크가 일시 정지되어 자동으로 재개했습니다. 계속 안 되면 중지 후 다시 시작해 주세요.', 'warn');
    }
    if(playCtx && playCtx.state==='suspended' && !muted){
      try{ playCtx.resume(); }catch(_){}
    }

    updateConvDiag();

    // 소켓은 열려 있는데 서버 응답이 오래 끊긴 경우를 알려준다.
    // 예전에는 이 상황에서 아무 표시 없이 경과시간만 흘렀다.
    if(lastServerMsgAt && (Date.now()-lastServerMsgAt) > 15000 && !silentNoticeShown){
      silentNoticeShown = true;
      showNotice('15초 이상 서버 응답이 없습니다. 소리가 마이크에 닿는지 확인하고, 계속되면 중지 후 다시 시작해 주세요.', 'warn');
    }
    if(lastServerMsgAt && (Date.now()-lastServerMsgAt) < 5000 && silentNoticeShown){
      silentNoticeShown = false;   // 응답이 돌아오면 안내를 내린다
      hideNotice();
    }

    // 2시간을 넘기면 세션을 나누도록 한 번 안내한다
    if(s>=7200 && !longNoticeShown){
      longNoticeShown=true;
      showNotice('2시간이 지났습니다. 중지 후 새 세션으로 나누면 저장 실패와 성능 저하를 예방할 수 있습니다.', 'warn');
    }
  },1000);
}
function stopElapsed(){ clearInterval(elapsedInt); elapsedInt=null; }

// 세션의 누적 소요시간(초). 진행 중이면 이번 구간까지 더해 계산한다.
// currentSession.durationSec 자체는 건드리지 않아 중복 합산을 막는다.
function getCurrentDurationSec(session){
  let base = (session && session.durationSec) || 0;
  if(session===currentSession && elapsedInt && startedAt){
    base += Math.floor((Date.now()-startedAt)/1000);
  }
  return base;
}

// 초 → "1시간 12분" / "12분" 형태로 표시. 1분 미만은 표시하지 않는다(의미가 적음).
function formatDuration(sec){
  if(!sec || sec<60) return '';
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60);
  return h>0 ? (h+'시간 '+m+'분') : (m+'분');
}

// 모드별 API 비용 추정치를 보여준다. 실측(음성이 계속 켜져 있는
// gemini-3.5-live-translate-preview, 오디오 입출력 강제 청구 기준) 값이며,
// 실제 발화량·언어에 따라 다소 달라질 수 있는 추정치다.
function updateCostLabel(){

  if(!el) return;

function toggleMode(){
  convMode = !convMode;
  // 회의 모드는 음소거 기본값(사용자가 나중에 저장된 선호로 바꿀 수 있음),
  // 대화 모드는 항상 강제로 켠다 — 저장값과 무관하게 매번 확실히 켠다.
  muted = convMode ? false : true;
  const mb=document.getElementById('muteBtn');
  if(mb){ mb.textContent = muted?'🔇':'🔊'; mb.classList.toggle('on', !muted); }
  if(convMode) initPlayback();   // 모드 전환도 사용자 조작이므로 여기서 오디오를 열 수 있다
  const btn = document.getElementById('modeBtn');
  const banner = document.getElementById('convBanner');
  const sgMeeting = document.getElementById('sgMeetingLang');
  const sgConv = document.getElementById('sgConvLang');
  const sgSession = document.getElementById('sgSession');

  if(convMode){
    btn.textContent = '🗣 대화'; btn.classList.add('conv');
    banner.classList.remove('hidden');
    sgMeeting.classList.add('hidden');
    sgConv.classList.remove('hidden');
    sgSession.classList.add('hidden');
  } else {
    btn.textContent = '📋 회의'; btn.classList.remove('conv');
    banner.classList.add('hidden');
    sgMeeting.classList.remove('hidden');
    sgConv.classList.add('hidden');
    sgSession.classList.remove('hidden');
  }
  updateLabels();
  updateCostLabel();
  updateConvDiag();
  localStorage.setItem('gt_mode', convMode ? '1' : '0');
  // 실행 중이면 재시작 안내
  if(ws && ws.readyState===1){
    showErr('모드 변경 후 중지 → 시작 버튼을 눌러주세요');
    setTimeout(()=>showErr(''), 3000);
  }
}

// ── PCM base64 → Float32 디코딩 후 재생 ──
function base64ToFloat32(b64, sampleRate){
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  const int16 = new Int16Array(bytes.buffer);
  const float32 = new Float32Array(int16.length);
  for(let i=0;i<int16.length;i++) float32[i]=int16[i]/32768.0;
  return float32;
}

// ══════════════════════════════════════
// 음성 재생 — 지터 버퍼 + 청크 병합 스케줄러
//
// 이전 구현이 두세 음절마다 끊긴 이유:
//  (1) 여유 시간 없이 ctx.currentTime에 바로 재생을 걸어서
//      네트워크가 조금만 늦어도 소리가 비어버림
//  (2) 서버가 보내는 작은 PCM 조각을 하나씩 따로 재생해 이음새가 들림
//  (3) 재생 경로에 await가 있어 동시 호출 시 재생 시점 계산이 뒤엉킴
//  (4) 사용자 조작 밖에서 AudioContext를 만들어 iOS가 정지 상태로 둠
// ══════════════════════════════════════
let playCtx = null;
let playHead = 0;        // 다음 소리를 배치할 시각
let pendBufs = [];       // 병합 대기 조각
let pendLen = 0;
let flushT = null;
const MIN_CHUNK = 0.12;  // 120ms 이상 모아서 한 번에 재생
// 지연 타이머(아래 flushT)가 너무 짧으면, 실제 오디오 조각 도착 간격보다
// 먼저 발동해 아직 덜 모인 짧은 조각을 성급하게 내보내게 된다. 그러면
// 이어서 도착한 다음 조각과의 이음새에서 lookahead 재조정이 반복되며
// 간격이 생기고, 그 결과 "몇 단어 재생 후 한 단어가 스킵되는" 것처럼
// 들린다. 실제 청크 도착 간격보다 확실히 넉넉한 값으로 늘린다.
const FLUSH_DELAY_MS = 180;
const MAX_AHEAD = 1.5;   // 실시간보다 이만큼 앞서면 밀린 소리를 버리고 다시 맞춘다

// 대화 모드는 세션이 둘(ws: 한국어→외국어, ws2: 외국어→한국어)인데
// 스피커는 하나다. 한 번에 한 방향만 스피커를 쓰게 해서
// 두 목소리가 한 버퍼에 섞이거나 동시에 겹치는 것을 막는다.
let speakerOwner = null;      // 'ws' | 'ws2'
let speakerIdleT = null;
let speakerOwnedSince = 0;    // 지금 방향이 스피커를 잡은 시각(연속 점유 시간 측정용)
const OWNER_IDLE_MS = 700;    // 이 시간 동안 새 소리가 없으면 스피커를 놓는다
// 오디오가 700ms보다 촘촘히 계속 들어오면 위 idle 타이머가 절대 발동하지 않을 수 있다.
// 그런 경우에도 한쪽이 스피커를 영원히 붙잡지 않도록 연속 점유 시간 자체에 상한을 둔다.
const OWNER_HARD_CAP_MS = 8000;
// 8초 하드캡은 "같은 방향이 계속 말할 때"만 체크되다 보니, 한쪽이 뜸하지
// 않게 계속 말하면 실질적으로 반대 방향은 영원히 기회를 못 받았다(기아 상태).
// 이제 이보다 훨씬 짧은 시간만 잡고 있어도 새로 도착한 반대 방향에 양보한다.
const OWNER_TAKEOVER_MS = 1200;
let gateStartAt = 0;          // 마이크 차단이 시작된 시각(연속 차단 시간 측정용)
const GATE_HARD_CAP_MS = 6000;

// 스피커가 통역 음성을 내는 동안에는 마이크 전송을 멈춘다.
// 그러지 않으면 스피커 소리가 마이크로 되들어가 끝없이 되번역된다.
let micMuteUntil = 0;
const MIC_GATE_MAX_MS = 2000;   // 어떤 경우에도 이 시간을 넘겨 막지 않는다(정지 방지)
let lastMicSendAt = 0;          // 마지막으로 마이크를 보낸 시각 — 정지 감지용
// 공식 문서: 오디오 스트림이 1초 넘게 끊기면 audioStreamEnd를 보내 서버가
// 캐시된 오디오를 플러시하고 턴을 마무리하게 해야 한다. 지금까지 이 신호를
// 전혀 보내지 않아, 서버가 계속 발화가 이어지는 것으로 보고 턴을 끝내지
// 못했을 가능성이 크다(turnComplete가 한 번도 온 적이 없었던 것과 일치).
let audioStreamEndSent = true;
// echoTargetLanguage:false로 설정해도, 입력이 이미 그 방향의 타겟 언어와
// 같을 때 모델이 가끔 예외적으로 음성을 만들어내는 경우가 관찰됐다
// (예: 한국어를 말했는데 ws2가 간헐적으로 한국어 소리를 냄).
// 방향별 타겟 언어와 최근 감지된 입력 언어를 기록해, 서로 같을 때는
// 그 방향의 오디오 재생 자체를 걸러낸다(텍스트는 그대로 둠).
let wsTargetLang = '';
let ws2TargetLang = 'ko';   // 대화 모드 시작 시 langA 값으로 갱신됨
let wsInputLang = '';
let ws2InputLang = '';  // 세션 시작 직후는 아직 보낸 적도 없고 보낼 이유도 없는 상태
let lastServerMsgAt = 0;        // 마지막으로 서버 응답을 받은 시각

// releaseSpeaker()는 문장 사이 짧은 침묵(700ms)마다도 호출되는데, 그때 연속-점유
// 하드캡(gateStartAt)이 함께 리셋돼버린다. 문장 여러 개가 짧은 틈을 두고 이어지면
// 하드캡이 매번 새로 시작해 사실상 무제한으로 막히는 구멍이 있었다.
// 이 값은 그런 리셋과 무관하게 "마이크를 실제로 보낸 마지막 시점"만 기준으로 삼는다.
let micBlockedSince = 0;
const MIC_BLOCK_ABS_CAP_MS = 5000;  // 이 시간 동안 한 번도 못 보냈으면 무조건 열어준다

function lookahead(){ return convMode ? 0.38 : 0.22; }

// 실증 결과: ws2 없이(경쟁 상대 없이) 마이크 차단 로직만 꺼도 대화가
// 몇 분씩 끊김 없이 안정적으로 이어졌다. 반대로 지금까지 대화 모드가
// 계속 멎었던 건 음향 피드백이 아니라, 이 마이크 차단 로직 자체가
// 모델의 턴 처리를 방해하고 있었기 때문으로 보인다.
// → 마이크는 이제 ws2가 있든 없든 항상 끊김 없이 스트리밍한다.
//   스피커에 무엇을 낼지(재생 쪽)만 아래 speakerOwner로 조율하고,
//   마이크 전송(서버로 보내는 쪽)은 더 이상 막지 않는다.
function needsHalfDuplex(){ return false; }

// 반드시 사용자 조작(시작/음소거 해제) 시점에 호출 — iOS 자동재생 제한 통과용
function initPlayback(){
  // 재생 컨텍스트를 여는 순간이 iOS가 마이크 컨텍스트를 정지시키는 가장 흔한 시점이다.
  // 여기서 마이크 쪽도 같이 깨워 충돌을 최소화한다.
  try{ if(actx && actx.state!=='running' && actx.state!=='closed') actx.resume(); }catch(_){}
  try{
    if(!playCtx || playCtx.state==='closed'){
      // 샘플레이트를 강제하지 않는다. iOS는 하드웨어 값을 쓰기 때문에
      // 24kHz를 강요하면 컨텍스트 생성이 실패하거나 재생이 거칠어진다.
      // 버퍼 자체에 24kHz를 실어 보내면 브라우저가 알아서 변환한다.
      playCtx = new (window.AudioContext||window.webkitAudioContext)();
    }
    if(playCtx.state==='suspended') playCtx.resume();
    // 무음 1샘플을 재생해 오디오 출력을 열어둔다
    const b=playCtx.createBuffer(1,1,playCtx.sampleRate);
    const s=playCtx.createBufferSource(); s.buffer=b;
    s.connect(playCtx.destination); s.start(0);
  }catch(_){}
  playHead=0; pendBufs=[]; pendLen=0;
  speakerOwner=null; micMuteUntil=0;
  if(speakerIdleT){ clearTimeout(speakerIdleT); speakerIdleT=null; }
}

function releaseSpeaker(){
  flushAudio();
  speakerOwner=null;
  speakerIdleT=null;
  speakerOwnedSince=0;
  gateStartAt=0;   // 스피커를 놓으면 마이크 차단도 더 이상 연장하지 않는다
}

// 서버가 이 방향의 응답이 끝났다고 명시적으로 알려온 경우(turnComplete).
// 지금까지는 700ms 침묵 추정에만 의존했는데, 이 신호가 훨씬 확실하다 —
// 침묵 추정이 어떤 이유로든 어긋나도(예: 서버가 아주 낮은 볼륨의 오디오를
// 계속 흘려보내는 경우) 여기서 바로 마이크를 되돌려준다.
function onTurnComplete(src){
  if(speakerOwner===src || speakerOwner===null){
    micMuteUntil = 0;
    micBlockedSince = 0;
    releaseSpeaker();
  }
}

// source: 'ws'(내 말 → 외국어) 또는 'ws2'(상대 말 → 한국어)
function playAudioChunk(f32, source){
  if(muted || !playCtx || playCtx.state==='closed') return;
  const src = source || 'ws';

  if(speakerOwner === null){
    speakerOwner = src; speakerOwnedSince = Date.now();
  } else if(speakerOwner !== src){
    // 반대 방향의 새 소리가 도착했다. 지금 소유자가 짧게(1.2초 이내) 잡은
    // 참이면 그대로 마저 재생하게 두고 이번 조각은 버린다.
    // 하지만 그보다 오래 잡고 있었다면 — 한쪽이 계속 말해서 반대 방향이
    // 영원히 기회를 못 받는 기아 상태이므로 — 지금 넘긴다.
    if(speakerOwnedSince && (Date.now()-speakerOwnedSince) > OWNER_TAKEOVER_MS){
      flushAudio();                         // 기존 소유자의 남은 버퍼는 먼저 내보내고
      speakerOwner = src; speakerOwnedSince = Date.now();
    } else {
      return;
    }
  } else if(speakerOwnedSince && (Date.now()-speakerOwnedSince) > OWNER_HARD_CAP_MS){
    // 같은 방향이 8초 넘게 쉬지 않고 계속 말하는 경우의 최종 안전장치
    releaseSpeaker();
    speakerOwner = src; speakerOwnedSince = Date.now();
  }

  if(speakerIdleT) clearTimeout(speakerIdleT);
  speakerIdleT = setTimeout(releaseSpeaker, OWNER_IDLE_MS);

  pendBufs.push(f32); pendLen += f32.length;
  if(pendLen >= PLAYBACK_SR*MIN_CHUNK) flushAudio();
  else if(!flushT) flushT = setTimeout(flushAudio, FLUSH_DELAY_MS);  // 마지막 조각도 늦지 않게
}

// 서버 오디오(24kHz)를 재생 컨텍스트의 실제 샘플레이트(보통 48kHz)로 직접 변환한다.
// 지금까지는 24kHz로 선언한 버퍼를 그대로 재생 컨텍스트에 넘기고 브라우저의
// 자동 리샘플링에 맡겼는데, iOS Safari에서 이 교차 샘플레이트 재생이 부정확해
// 여러 버퍼가 이어질수록 오차가 누적되며 "테이프가 늘어지는" 듯한 왜곡이
// 생기는 것으로 보인다. 데이터를 직접 변환해 버퍼-컨텍스트 샘플레이트를 맞춘다.
function resamplePCM(f32, fromRate, toRate){
  if(fromRate === toRate) return f32;
  const ratio = toRate / fromRate;
  const outLen = Math.round(f32.length * ratio);
  const out = new Float32Array(outLen);
  for(let i=0;i<outLen;i++){
    const srcPos = i / ratio;
    const i0 = Math.floor(srcPos);
    const i1 = Math.min(i0+1, f32.length-1);
    const frac = srcPos - i0;
    out[i] = f32[i0] + (f32[i1]-f32[i0])*frac;   // 선형보간
  }
  return out;
}

function flushAudio(){
  if(flushT){ clearTimeout(flushT); flushT=null; }
  if(!playCtx || playCtx.state==='closed' || !pendBufs.length) return;

  const total=pendLen;
  const merged=new Float32Array(total);
  let off=0; for(const b of pendBufs){ merged.set(b,off); off+=b.length; }
  pendBufs=[]; pendLen=0;

  // 서버 오디오(PLAYBACK_SR=24kHz)를 컨텍스트의 실제 샘플레이트로 직접 리샘플링한다.
  // 버퍼를 컨텍스트와 동일한 샘플레이트로 선언해 브라우저의 교차 샘플레이트
  // 리샘플링(iOS에서 부정확한 사례가 보고됨)을 아예 거치지 않게 한다.
  const ctxRate = playCtx.sampleRate;
  const resampled = resamplePCM(merged, PLAYBACK_SR, ctxRate);
  const buf=playCtx.createBuffer(1, resampled.length, ctxRate);
  buf.copyToChannel(resampled,0);
  const src=playCtx.createBufferSource();
  src.buffer=buf; src.connect(playCtx.destination);

  const now=playCtx.currentTime;
  const LA=lookahead();
  // 실시간보다 너무 앞서 예약돼 있으면(피드백이나 폭주) 밀린 소리를 버리고 다시 맞춘다
  if(playHead - now > MAX_AHEAD) playHead = now + LA;
  // 재생 시점이 현재를 지나쳤으면 여유를 다시 확보 (끊김 대신 짧은 지연을 택함)
  if(playHead < now + 0.02) playHead = now + LA;

  try{ src.start(playHead); }catch(_){ return; }
  playHead += buf.duration;

  // 이 소리가 끝날 때까지 마이크를 막아 스피커→마이크 되돌이를 끊는다.
  // 단, 오디오가 실제로 재생 중일 때만 막고, 상한을 두어 영구히 막히는 일을 방지한다.
  if(needsHalfDuplex() && playCtx.state === 'running'){
    const nowMs = Date.now();
    if(!gateStartAt) gateStartAt = nowMs;   // 이번 연속 차단 구간의 시작
    if(nowMs - gateStartAt < GATE_HARD_CAP_MS){
      const span = Math.min(Math.max(0, playHead-now)*1000 + 220, MIC_GATE_MAX_MS);
      const until = nowMs + span;
      if(until > micMuteUntil) micMuteUntil = until;
    }
    // 연속 차단이 6초를 넘으면 더 이상 연장하지 않는다 —
    // 재생이 계속되더라도 마이크는 곧 풀려 정지 상태를 벗어난다.
  }
}

function stopPlayback(){
  if(flushT){ clearTimeout(flushT); flushT=null; }
  if(speakerIdleT){ clearTimeout(speakerIdleT); speakerIdleT=null; }
  pendBufs=[]; pendLen=0; playHead=0;
  speakerOwner=null; micMuteUntil=0;
  speakerOwnedSince=0; gateStartAt=0;
  if(playCtx){ try{ playCtx.close(); }catch(_){} playCtx=null; }
}

// ── 설정 저장/불러오기 ──
function saveSettings(){
  const key = document.getElementById('apiKey').value.trim();
  if(key) localStorage.setItem('gt_apikey', key);
  const sl = document.getElementById('srcLang')?.value;
  const dl = document.getElementById('dstLang')?.value;
  const la = document.getElementById('langA')?.value;
  const lb = document.getElementById('langB')?.value;
  if(sl) localStorage.setItem('gt_srcLang', sl);
  if(dl) localStorage.setItem('gt_dstLang', dl);
  if(la) localStorage.setItem('gt_langA', la);
  if(lb) localStorage.setItem('gt_langB', lb);
  const profile = document.getElementById('myProfile')?.value;
  const meetingInfo = document.getElementById('meetingInfo')?.value;
  localStorage.setItem('gt_myProfile', profile||'');       // 내 프로필은 빈 값도 그대로 저장(지우면 지워지게)
  localStorage.setItem('gt_meetingInfo', meetingInfo||'');
}

function loadSettings(){
  const key = localStorage.getItem('gt_apikey');
  if(key){ document.getElementById('apiKey').value=key; showKeySaved(true); }
  const setSel=(id,val)=>{
    const s=document.getElementById(id);
    if(s && val && [...s.options].some(o=>o.value===val)) s.value=val;
  };
  setSel('srcLang', localStorage.getItem('gt_srcLang'));
  setSel('dstLang', localStorage.getItem('gt_dstLang'));
  setSel('langA',   localStorage.getItem('gt_langA'));
  setSel('langB',   localStorage.getItem('gt_langB'));
  const profileEl = document.getElementById('myProfile');
  const meetingInfoEl = document.getElementById('meetingInfo');
  // 실제 프로필을 기본값으로 넣으면 다른 사람이 접속했을 때도 그대로 보이므로,
  // 아무것도 저장돼 있지 않으면 빈 값(placeholder 예시 문구만 보임)으로 둔다.
  if(profileEl) profileEl.value = localStorage.getItem('gt_myProfile') || '';
  if(meetingInfoEl) meetingInfoEl.value = localStorage.getItem('gt_meetingInfo') || '';
  const fs = parseInt(localStorage.getItem('gt_fontsize')||'15',10);
  if(fs>=11 && fs<=26) applyFont(fs);
  if(localStorage.getItem('gt_mode')==='1' && !convMode) toggleMode();
  // 대화 모드는 음성 통역이 기능의 핵심이므로, 어떤 저장값이 있든 항상 켠 채로 시작한다.
  // 여러 차례 "음소거 저장값이 덮어써서 소리가 안 난다"는 문제가 반복돼,
  // 아예 대화 모드에서는 저장된 음소거 설정을 참조하지 않도록 단순화했다.
  // 회의 모드는 지금까지처럼 사용자가 저장한 선호를 그대로 복원한다.
  if(!convMode){
    const mv = localStorage.getItem('gt_muted');
    if(mv!==null) setMute(mv==='1');
  } else {
    setMute(false);
  }
  const rv = localStorage.getItem('gt_refine');

  updateLabels();
}

function f32i16(buf){const o=new Int16Array(buf.length);for(let i=0;i<buf.length;i++){const s=Math.max(-1,Math.min(1,buf[i]));o[i]=s<0?s*0x8000:s*0x7FFF;}return o;}
function b64(i16){const b=new Uint8Array(i16.buffer);let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}

async function parse(e){
  let txt=typeof e.data==='string'?e.data:(e.data instanceof Blob?await e.data.text():new TextDecoder().decode(e.data));
  try{
    const d=JSON.parse(txt);

    // 세션 재개 핸들 저장
    if(d.sessionResumptionUpdate?.newHandle){
      resumptionHandle = d.sessionResumptionUpdate.newHandle;
    }

    // GoAway 감지 → 자동 재연결
    if(d.goAway){
      setStatus('connected', '재연결 중... (세션 갱신)');
      setTimeout(()=>reconnectSession(), 500);
      return;
    }

    const sc=d.serverContent;if(!sc)return;

    if(sc.turnComplete && convMode){ rxCount.ws.turn++; onTurnComplete('ws'); }
    if(sc.outputTranscription?.text || sc.inputTranscription?.text) rxCount.ws.text++;

    const srcArr=currentSession?currentSession.src:null;
    const dstArr=currentSession?currentSession.dst:null;
    // 대화 모드에서 ws의 출력은 외국어이므로 별도 색상(fo)으로 구분
    const outCls = convMode ? 'fo' : 'ko';
    // 이 메시지의 문단번호를 먼저 확정한 뒤 원문·번역에 똑같이 적용한다.
    // 길이 기준 분리는 메시지를 다 처리한 다음에 적용해 번역이 밀리지 않게 한다.
    const inTxt = sc.inputTranscription?.text;
    let msgSeg = null;
    if(inTxt){
      const info=noteSource(inTxt);
      msgSeg = info.seg;
      if(info.lang) wsInputLang = info.lang;
      appendText('srcBox',inTxt,'',srcArr,info.seg,info.lang);
    }
    // 오디오와 같은 기준으로 텍스트도 걸러낸다
    const wsTextOk = !wsTargetLang || wsInputLang!==wsTargetLang;
    if(sc.outputTranscription?.text && wsTextOk)
      appendDstText(sc.outputTranscription.text,outCls,dstArr,msgSeg);

    if(sc.modelTurn?.parts){
      for(const p of sc.modelTurn.parts){
        if(p.inlineData?.data){
          rxCount.ws.audio++;
          if(!muted && wsTextOk && p.inlineData.mimeType?.startsWith('audio/')){
            playAudioChunk(base64ToFloat32(p.inlineData.data, PLAYBACK_SR), 'ws');
          }
        }
        if(p.text && wsTextOk) appendDstText(p.text,outCls,dstArr,msgSeg);
      }
    }

    // 길이 초과 분리는 이 메시지를 모두 처리한 뒤에 — 다음 메시지부터 새 문단
    if(inTxt) noteSourceAfter(inTxt);
  }catch(err){
    lastParseError = 'ws: '+(err?.message||String(err));
    lastParseErrorAt = Date.now();
    updateConvDiag();
  }
}

let resumptionHandle = null;
let isReconnecting = false;
let reconnectTries = 0;
let ws2Tries = 0;            // 대화 모드 역방향 세션의 복구 시도 횟수
const MAX_RECONNECT = 5;
let currentKey = '';
let currentTargetLang = '';
let currentSessionName = '';

// ── 마이크 프로세서 시작 ──
function startMicProcessor(){
  if(proc || !actx || !stream) return;
  const src = actx.createMediaStreamSource(stream);
  proc = actx.createScriptProcessor(2048,1,1);
  proc.onaudioprocess = ev => {
    const nowTick = Date.now();
    // 1초 넘게 실제 오디오를 못 보냈으면(게이트 중이든 자연스러운 침묵이든)
    // 서버에 스트림이 끊겼음을 알린다. 같은 침묵 구간에서 반복 전송하지 않는다.
    if(needsHalfDuplex() && lastMicSendAt && (nowTick - lastMicSendAt) > 1000 && !audioStreamEndSent){
      const endMsg = JSON.stringify({realtimeInput:{audioStreamEnd:true}});
      if(ws && ws.readyState===1) ws.send(endMsg);
      if(ws2 && ws2.readyState===1) ws2.send(endMsg);
      audioStreamEndSent = true;
    }

    if(needsHalfDuplex() && Date.now() < micMuteUntil){
      const now = Date.now();
      if(!micBlockedSince) micBlockedSince = now;

      // 절대 상한: 짧은 문장이 틈을 두고 반복돼 개별 차단이 계속 새로 걸리더라도,
      // "마지막으로 마이크를 보낸 시점"으로부터 5초가 지났으면 재생 중이든 말든 무조건 연다.
      if(now - micBlockedSince > MIC_BLOCK_ABS_CAP_MS){
        micMuteUntil = 0; micBlockedSince = 0;
        releaseSpeaker();   // 반대 방향에게도 스피커 기회를 준다
      } else if(micMuteUntil - now > MIC_GATE_MAX_MS){
        micMuteUntil = 0;   // 개별 차단 자체가 비정상적으로 크면 즉시 해제
      } else {
        return;
      }
    } else {
      micBlockedSince = 0;   // 막혀있지 않은 정상 상태 — 시계 리셋
    }
    const data = b64(f32i16(ev.inputBuffer.getChannelData(0)));
    // ws·ws2에 보내는 내용이 완전히 같으므로 문자열을 한 번만 만들어 재사용한다.
    // 128ms마다 반복되는 이 콜백에서 직렬화를 두 번 하던 게 메인 스레드
    // 부담을 키워, 처리가 살짝 밀리면 다음 오디오 프레임 자체가 통째로
    // 건너뛰어지는 원인이 됐을 수 있다(몇 단어가 안 들리는 증상과 부합).
    let sent = false;
    if((ws && ws.readyState===1) || (convMode && ws2 && ws2.readyState===1)){
      const payload = JSON.stringify({realtimeInput:{audio:{data, mimeType:'audio/pcm;rate=16000'}}});
      if(ws && ws.readyState===1){ ws.send(payload); sent = true; }
      if(convMode && ws2 && ws2.readyState===1){ ws2.send(payload); sent = true; }
    }
    if(sent){ lastMicSendAt = Date.now(); micBlockedSince = 0; audioStreamEndSent = false; }
  };
  src.connect(proc);
  proc.connect(actx.destination);
}

// setup 구성 단계: 0=전체(무제한 세션+재개), 1=최소(검증된 기본형)
// 서버가 setup을 거부하면 자동으로 1단계로 내려가 스스로 복구한다
let setupTier = 0;

// 지금까지 음성을 고정하지 않아 모델이 매 턴마다 임의로 목소리를 골랐다.
// 방향마다 고정된 음성을 지정해 (1) 같은 방향은 항상 같은 목소리로 말하고,
// (2) 두 방향의 목소리를 다르게 해서 어느 쪽이 말하는지 귀로 구분하기 쉽게 한다.
const VOICE_WS  = 'Puck';   // 내 말 → 외국어(ws)
const VOICE_WS2  = 'Kore';  // 상대 말 → 한국어(ws2)

function buildSetup(targetLang, isEcho, voiceName){
  const s = {
    model:'models/gemini-3.5-live-translate-preview',
    generationConfig:{
      responseModalities:['AUDIO'],
      translationConfig:{ targetLanguageCode:targetLang, echoTargetLanguage:!!isEcho }
    }
  };
  if(voiceName){
    s.generationConfig.speechConfig = { voiceConfig:{ prebuiltVoiceConfig:{ voiceName } } };
  }
  if(setupTier === 0){
    // 아래 두 항목은 generationConfig가 아니라 setup 최상위 필드다
    s.contextWindowCompression = { slidingWindow:{} };
    s.sessionResumption = resumptionHandle ? { handle: resumptionHandle } : {};
  }
  return s;
}

function openWS(key, targetLang, isEcho, onMsg, assignTo){
  const voiceName = assignTo==='ws2' ? VOICE_WS2 : VOICE_WS;
  const url='wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key='+key;
  const socket = new WebSocket(url);
  socket.binaryType = 'blob';
  socket._gotData = false;   // 서버 응답을 한 번이라도 받았는지 (setup 성공 판정)
  socket.onopen = () => {
    socket._openedAt = Date.now();
    socket.send(JSON.stringify({setup: buildSetup(targetLang, isEcho, voiceName)}));
    if(assignTo === 'ws'){
      const label = convMode
        ? '🗣 대화 모드 — '+langPairLabel(currentSession?currentSession.lang:'conv|en')
        : '녹음 중 — '+currentSessionName;
      setStatus('recording', label);
      document.getElementById('stopBtn').disabled = false;
      startMicProcessor();
      if(!elapsedInt){ startElapsed(); startAutoSave(); }
      acquireWakeLock();
      isReconnecting = false;
    }
  };
  socket.onmessage = ev => {
    lastServerMsgAt = Date.now();
    if(!socket._gotData){
      socket._gotData = true;            // setup 통과 확인
      if(assignTo === 'ws'){
        reconnectTries = 0;              // 정상 수신되면 재시도 카운터 초기화
        showErr('');
      } else if(assignTo === 'ws2'){
        ws2Tries = 0;                    // 역방향도 정상 수신되면 카운터 초기화
        updateConvDiag();
      }
    }
    onMsg(ev);
  };
  socket.onerror = () => { if(!isReconnecting && assignTo==='ws'){ showErr('연결 오류.'); cleanup(); } };
  socket.onclose = ev => {
    if(ev.code === 1000) return;

    // ws2(상대 → 한국어)가 끊긴 경우: 이전에는 조용히 무시해 원인을 알 수 없었다.
    // 이제 사유를 알리고, 대화가 진행 중이면 독립적으로 한 번 되살린다.
    if(assignTo === 'ws2'){
      ws2 = null;
      updateConvDiag();
      if(convMode && currentKey && currentSession && ws2Tries < MAX_RECONNECT){
        ws2Tries++;
        showNotice('상대방 → 한국어 방향이 끊겼습니다 ('+ev.code+') '+(ev.reason||'')+' — 되살리는 중 ('+ws2Tries+'/'+MAX_RECONNECT+')', 'warn');
        setTimeout(()=>{
          if(!convMode || !currentKey) return;
          ws2 = openWS(currentKey, ws2TargetLang, false, parseConvReverse, 'ws2');
        }, Math.min(1000*ws2Tries, 4000));
      } else if(convMode){
        showNotice('상대방 → 한국어 방향을 복구하지 못했습니다 ('+ev.code+') '+(ev.reason||'')+'. 중지 후 다시 시작해 주세요.', 'danger');
      }
      return;
    }

    const alive = Date.now() - (socket._openedAt || Date.now());
    const configRejected = !socket._gotData && alive < 8000;

    // setup이 거부된 경우 — 재연결해도 같은 결과이므로 구성을 낮춰 1회만 재시도
    if(configRejected){
      if(setupTier === 0){
        setupTier = 1;
        showErr('세션 옵션 미지원 → 기본 구성으로 재시도합니다');
        setTimeout(()=>{ isReconnecting=true; reconnectSession(); }, 300);
        return;
      }
      showErr('연결 거부 ('+ev.code+') '+(ev.reason||'사유 없음'));
      cleanup();
      return;
    }

    // 정상 작동 중 끊긴 경우 — 횟수 제한을 두고 재연결
    if(currentKey && currentSession && reconnectTries < MAX_RECONNECT){
      reconnectTries++;
      setStatus('','재연결 시도 중... ('+reconnectTries+'/'+MAX_RECONNECT+')');
      setTimeout(reconnectSession, Math.min(1000*reconnectTries, 5000));
      return;
    }

    showErr('연결 끊김 ('+ev.code+') '+(ev.reason||'')+' — 시작을 다시 눌러주세요');
    cleanup();
  };
  return socket;
}

function reconnectSession(){
  if(!currentKey || !currentSession) return;
  isReconnecting = true;
  if(ws){ try{ws.close(1000);}catch(_){} ws=null; }
  if(ws2){ try{ws2.close(1000);}catch(_){} ws2=null; }
  ws = openWS(currentKey, currentTargetLang, false, parse, 'ws');
  if(convMode) ws2 = openWS(currentKey, ws2TargetLang, false, parseConvReverse, 'ws2');
}

async function parseConvReverse(e){
  let txt=typeof e.data==='string'?e.data:(e.data instanceof Blob?await e.data.text():new TextDecoder().decode(e.data));
  try{
    const d=JSON.parse(txt); const sc=d.serverContent; if(!sc)return;

    if(sc.turnComplete){ rxCount.ws2.turn++; onTurnComplete('ws2'); }
    if(sc.outputTranscription?.text) rxCount.ws2.text++;

    // ws2가 지금 무슨 언어를 듣고 있는지 감지해둔다(ws2 자신의 오디오 게이트에 사용)
    if(sc.inputTranscription?.text){
      const lang2 = detectScript(sc.inputTranscription.text);
      if(lang2) ws2InputLang = lang2;
    }

    // 오디오와 같은 이유로 텍스트도 걸러낸다 — 입력이 이미 한국어(ws2의
    // 타겟 언어)면 echo=false에서도 간혹 뒤섞인 텍스트가 나오는 것으로 보인다.
    const ws2TextOk = ws2InputLang!==ws2TargetLang;
    if(sc.outputTranscription?.text && ws2TextOk) appendDstText(sc.outputTranscription.text,'ko',currentSession?.dst||null);
    if(sc.modelTurn?.parts){
      for(const p of sc.modelTurn.parts){
        if(p.inlineData?.data){
          rxCount.ws2.audio++;
          if(!muted && ws2TextOk && p.inlineData.mimeType?.startsWith('audio/'))
            playAudioChunk(base64ToFloat32(p.inlineData.data, PLAYBACK_SR), 'ws2');
        }
        if(p.text && ws2TextOk) appendDstText(p.text,'ko',currentSession?.dst||null);
      }
    }
  }catch(err){
    lastParseError = 'ws2: '+(err?.message||String(err));
    lastParseErrorAt = Date.now();
    updateConvDiag();
  }
}

async function startTranslation(){
  showErr('');
  const key = document.getElementById('apiKey').value.trim();
  if(!key){ showErr('API Key를 입력해주세요.'); return; }

  let targetLang, sessionName, langPairStr;
  if(convMode){
    targetLang = document.getElementById('langB').value;   // ws(내→상대) 방향의 타겟
    sessionName = '대화 ' + dateStr();
    const la = document.getElementById('langA').value;
    langPairStr = la+'↔'+targetLang;
  } else {
    targetLang = document.getElementById('dstLang').value;
    sessionName = document.getElementById('sessionName').value.trim() || ('세션 '+dateStr());
    const src = document.getElementById('srcLang').value;
    langPairStr = src+'→'+targetLang;
  }
  updateLabels();

  usageSessionId = 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  sendUsageEvent('start', { app:'main', mode: convMode?'conv':'meeting', langPair: langPairStr });

  // 기존 데이터 있으면 이어서 여부 확인 (회의 모드만)
  const hasExisting = !convMode && currentSession && (currentSession.src.length>0 || currentSession.dst.length>0);
  let keepSession = false;
  if(hasExisting){
    keepSession = confirm('기존 세션 "'+currentSession.name+'"에 내용이 있습니다.\n\n확인: 이어서 기록\n취소: 새 세션으로 시작');
  }

  currentKey = key;
  currentTargetLang = targetLang;
  currentSessionName = keepSession ? currentSession.name : sessionName;
  resumptionHandle = null;
  reconnectTries = 0;
  ws2Tries = 0;
  wsInputLang = ''; ws2InputLang = '';
  micMuteUntil = 0;
  micBlockedSince = 0;
  lastMicSendAt = 0;
  lastServerMsgAt = 0;
  silentNoticeShown = false;
  lastParseError = null; lastParseErrorAt = 0;
  rxCount.ws.text=0; rxCount.ws.audio=0; rxCount.ws.turn=0;
  rxCount.ws2.text=0; rxCount.ws2.audio=0; rxCount.ws2.turn=0;
  audioStreamEndSent = true;
  setupTier = 0;          // 매 시작마다 전체 구성부터 다시 시도

  // 문단번호 초기화 — 이어쓰기면 기존 최대값 다음부터 시작
  if(keepSession && currentSession){
    let mx=-1;
    [...(currentSession.src||[]),...(currentSession.dst||[])].forEach(x=>{
      const n=Number(x.seg); if(!isNaN(n)&&n>mx) mx=n;
    });
    segId = mx+1;
  } else {
    segId = 0;
  }
  segLang=''; segChars=0; dstSeg=segId; dstPrevEnded=true;
  pendingCandidateLen=null; pendingSince=null;
  pendingSilenceBreak=false; lastSrcEndedSentence=true;
  refinedSegs.clear(); refineQueue=[]; refineBusy=false;
  if(!keepSession){ meetingRollingSummary = ''; suggestSegCount = 0; suggestHistory = []; closeSuggestPanel(); }   // 이어쓰기면 발언추천 맥락도 유지
  longNoticeShown=false;
  hideNotice();
  checkStorage();   // 시작 전에 저장 공간을 미리 확인
  if(segSilenceT){clearTimeout(segSilenceT);segSilenceT=null;}

  if(!keepSession){
    currentSession = {
      id: 's_'+Date.now(),
      name: currentSessionName,
      startTime: new Date().toISOString(),
      startTimeStr: dateStr(),
      lang: convMode ? ('conv|'+document.getElementById('langA').value+'|'+document.getElementById('langB').value) : (document.getElementById('dstLang')?.value+'|'+(document.getElementById('srcLang')?.value||'auto')),
      src:[], dst:[], summary:'', durationSec:0
    };
    if(!hasExisting){
      document.getElementById('srcBox').innerHTML='';
      document.getElementById('dstBox').innerHTML='';
    }
    updateCurrentCard();
    updateCtrlSession();
  }

  // 설정 패널 닫기
  const panel = document.getElementById('settingsPanel');
  if(panel && !panel.classList.contains('collapsed')){
    panel.classList.add('collapsed');
    document.getElementById('settingsToggle')?.classList.remove('open');
  }

  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{sampleRate:SR,channelCount:1,echoCancellation:true,noiseSuppression:true},video:false});
  } catch(err){ showErr('마이크 권한 필요: '+err.message); return; }

  // 대화 모드는 시작하는 이 순간에도 다시 한번 강제로 켠다 — 지금까지 이 지점에서
  // 저장값·모드전환 타이밍 문제로 음소거가 남아있는 사례가 반복됐던 최종 안전장치.
  if(convMode){
    muted = false;
    const mb=document.getElementById('muteBtn');
    if(mb){ mb.textContent='🔊'; mb.classList.add('on'); }
  }
  actx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:SR});
  try{ if(actx.state==='suspended') await actx.resume(); }catch(_){}
  if(!muted) initPlayback();   // 시작 버튼 = 사용자 조작이므로 여기서 오디오를 열어야 한다
  setStatus('','연결 중...');
  document.getElementById('startBtn').disabled = true;

  if(convMode){
    const la = document.getElementById('langA').value;   // 내 언어
    const lb = document.getElementById('langB').value;   // 상대방 언어
    // echo=false 필수: true면 이미 대상 언어인 발화도 되읽어서 음성이 2중으로 겹침
    // 두 세션을 동시에 열면 서버가 한쪽을 거부하는 경우가 있어 시차를 둔다
    wsTargetLang = lb;
    ws2TargetLang = la;
    ws  = openWS(key, lb,   false, parse,            'ws');   // 내(A) → 상대(B) 음성
    setTimeout(()=>{
      if(!convMode || !currentKey || !currentSession) return;
      ws2 = openWS(key, la, false, parseConvReverse, 'ws2'); // 상대(B) → 나(A) 음성
      updateConvDiag();
    }, 900);
  } else {
    ws = openWS(key, targetLang, false, parse, 'ws');
  }
}

function cleanup(){
  if(usageSessionId){ sendUsageEvent('stop'); usageSessionId = null; }
  if(proc){try{proc.disconnect();}catch(_){}proc=null;}
  if(actx){try{actx.close();}catch(_){}actx=null;}
  stopPlayback();
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  if(ws){try{ws.close(1000);}catch(_){}ws=null;}
  if(ws2){try{ws2.close(1000);}catch(_){}ws2=null;}
  if(segSilenceT){clearTimeout(segSilenceT);segSilenceT=null;}
  if(currentSession) currentSession.durationSec = getCurrentDurationSec(currentSession);
  micMuteUntil = 0;
  micBlockedSince = 0;
  stopElapsed();
  stopAutoSave();
  const cd=document.getElementById('convDiag'); if(cd) cd.textContent='';
  releaseWakeLock();

  // 내용이 있으면 자동 저장 — 저장 버튼을 잊어도 회의록이 남도록
  if(currentSession && (currentSession.src.length||currentSession.dst.length)){
    if(upsertSession(currentSession)){
      renderSessionList();
      setStatus('','대기 중 · 회의록 자동 저장됨');
    } else {
      setStatus('','대기 중');
    }
  } else {
    setStatus('','대기 중');
  }

  document.getElementById('startBtn').disabled=false;
  document.getElementById('stopBtn').disabled=true;
  updateCurrentCard();
}
function stopTranslation(){
  const hadContent = currentSession && (currentSession.src.length||currentSession.dst.length);
  cleanup();
  if(refineOn && !convMode && hadContent){
    const sess = currentSession;
    // 마지막 문단은 bumpSegment를 거치지 않아 큐에 없고,
    // 중지 시점에 아직 처리되지 않은 문단도 남아 있을 수 있으므로 전부 챙긴다.
    const n = refinePendingAll();
    if(n > 0){
      setStatus('','대기 중 · 남은 문단 '+n+'개 다듬는 중...');
      const t0 = Date.now();
      const waitDone = ()=>{
        // 최대 2분까지만 기다린다 — 응답이 없어도 저장은 반드시 하고 끝낸다
        if((refineBusy || refineQueue.length) && Date.now()-t0 < 120000){
          setTimeout(waitDone, 400); return;
        }
        if(sess) upsertSession(sess);   // 다듬은 결과를 저장에 반영
        renderSessionList();
        setStatus('','대기 중 · 회의록 저장됨');
      };
      setTimeout(waitDone, 600);
    }
  }
}

function getSessions(){

}
function setSessions(arr){
  localStorage.setItem('gt_sessions',JSON.stringify(arr));
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// 원문·번역을 문단번호로 짝지어 묶는다.
// seg가 없는 예전 세션은 순번으로 대응시켜 하위 호환을 지킨다.
function pairSegments(session){
  const src=session.src||[], dst=session.dst||[];
  const hasSeg = src.some(x=>x.seg!=null) || dst.some(x=>x.seg!=null);

  if(!hasSeg){
    const n=Math.max(src.length,dst.length), out=[];
    for(let i=0;i<n;i++) out.push({key:String(i), src:src[i]?[src[i]]:[], dst:dst[i]?[dst[i]]:[]});
    return out;
  }
  const map=new Map();
  const add=(item,which)=>{
    const k=String(item.seg!=null?item.seg:'_');
    if(!map.has(k)) map.set(k,{key:k,src:[],dst:[]});
    map.get(k)[which].push(item);
  };
  src.forEach(x=>add(x,'src'));
  dst.forEach(x=>add(x,'dst'));
  return [...map.values()].sort((a,b)=>(Number(a.key)||0)-(Number(b.key)||0));
}

function segMeta(sg){
  const first = sg.src[0] || sg.dst[0] || {};
  const langItem = sg.src.find(x=>x.lang) || {};
  return { time: first.time||'', lang: langItem.lang||'' };
}

// 세션을 id 기준으로 저장/갱신 (중복 누적 방지)
function upsertSession(session){
  if(!session || (!session.src.length && !session.dst.length)) return false;
  if(!session.id) session.id='s_'+Date.now();
  try{
    const arr=getSessions();
    const i=arr.findIndex(s=>s.id===session.id);
    const copy=JSON.parse(JSON.stringify(session));
    if(i>=0) arr[i]=copy; else arr.unshift(copy);
    setSessions(arr);
    return true;
  }catch(err){
    const cap = learnQuota();   // 실패 지점을 실측 한도로 학습
    updateStorageLabel();
    showErr('저장 공간 부족 — 저장 실패');
    const capTxt = cap ? (' (실측 한도 약 '+(Math.round(cap/1024/1024*10)/10)+'MB)') : '';
    // 데이터가 메모리에만 있는 상태다. 경고만 하지 말고 바로 내려받게 한다.
    showNotice('저장 공간이 가득 차 저장하지 못했습니다'+capTxt+'. 기록이 사라지기 전에 파일로 내려받고 오래된 회의록을 삭제해 주세요.',
      'danger', { label:'지금 다운로드', fn:()=>{ try{ downloadSession(session); }catch(_){} } });
    return false;
  }
}

  const ok=upsertSession(currentSession);   // 같은 세션이면 갱신, 새 세션이면 추가

}

// ── 세션 텍스트 빌드 ──
// 요약문 안의 제목을 한 단계 낮춘다 — 'AI 요약' 아래로 자연스럽게 들어가도록
function demoteHeadings(md){
  return String(md).replace(/^(#{1,5})\s+/gm, (m,h)=>'#'.repeat(h.length+1)+' ');
}

function buildFullText(session, opts){
  const includeSummary = !opts || opts.summary !== false;
  let txt='# '+session.name+'\n\n';
  txt+='- 일시: '+session.startTimeStr+'\n';
  if(formatDuration(session.durationSec)) txt+='- 소요시간: '+formatDuration(session.durationSec)+'\n';
  txt+='- 언어: '+langPairLabel(session.lang)+'\n\n';
  txt+='---\n\n';

  // AI 요약이 있으면 맨 앞에 넣는다 — 문서를 열자마자 결론부터 보이게
  const summMap = summariesOf(session);
  const summLangs = Object.keys(summMap);
  if(includeSummary && summLangs.length){
    summLangs.forEach(lang=>{
      const t = summMap[lang];
      if(t && t.trim()){
        txt+='## AI 요약 ('+(langName[lang]||lang)+')\n\n'+demoteHeadings(t.trim())+'\n\n';
      }
    });
    txt+='---\n\n';
  }

  txt+='## 전문 (원문 · 번역)\n\n';
  const segs=pairSegments(session);
  segs.forEach((sg,n)=>{
    const m=segMeta(sg);
    txt+='### 문단 '+(n+1);
    if(m.time) txt+=' · '+m.time;
    if(scriptTag[m.lang]) txt+=' · '+scriptTag[m.lang];
    txt+='\n\n';
    if(sg.src.length) txt+='**원문**\n\n'+sg.src.map(x=>x.text).join(' ')+'\n\n';
    if(sg.dst.length) txt+='**번역**\n\n'+sg.dst.map(x=>x.text).join(' ')+'\n\n';
  });
  return txt;
}

// ── 다운로드 ──
// 파일명에 마침표를 쓰지 않는다 — 여러 개 있으면 iOS가 확장자를 잘못 인식한다
function safeFileName(session){
  const base=(session.name||'session')
    .replace(/[^0-9A-Za-z\uAC00-\uD7A3\u3131-\u318E _-]+/g,'')
    .replace(/\s+/g,'_')
    .replace(/_+/g,'_')
    .replace(/^[_-]+|[_-]+$/g,'')
    .slice(0,60) || 'session';
  const d = session.startTime ? new Date(session.startTime) : new Date();
  const z = n => String(n).padStart(2,'0');
  const stamp = d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes());
  return base+'_'+stamp+'.md';
}

function downloadSession(session){
  const txt=buildFullText(session);
  const blob=new Blob([txt],{type:'text/markdown;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=safeFileName(session);
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function downloadCurrent(){
  if(!currentSession){alert('세션이 없습니다.');return;}
  downloadSession(currentSession);
}
function downloadModal(){
  if(!modalSession)return;
  downloadSession(modalSession);
}

// 마크다운 → Plain Text 변환 후 복사
async function copySummary(areaId, btnId){
  const area=document.getElementById(areaId);
  if(!area){return;}
  const boxes=area.querySelectorAll('.summary-box');
  if(!boxes.length){alert('요약 내용이 없습니다.');return;}
  let raw='';
  boxes.forEach((box,i)=>{
    let one=box.innerHTML.replace(/<br\s*\/?>/gi,'\n').replace(/<[^>]+>/g,'');
    const ta0=document.createElement('textarea');
    ta0.innerHTML=one; one=ta0.value;
    raw += (i>0?'\n\n':'') + one;
  });
  // HTML 엔티티 디코딩
  const ta=document.createElement('textarea');
  ta.innerHTML=raw; raw=ta.value;
  // 마크다운 기호 제거
  let plain=raw
    .replace(/^#{1,6}\s*/gm,'')          // ## 헤더
    .replace(/\*\*(.*?)\*\*/g,'$1')       // **bold**
    .replace(/\*(.*?)\*/g,'$1')           // *italic*
    .replace(/^[\*\-]\s+/gm,'• ')         // - 목록 → •
    .replace(/^\d+\.\s+/gm,(m)=>m)       // 숫자 목록 유지
    .replace(/`{1,3}(.*?)`{1,3}/g,'$1')  // `코드`
    .trim();
  try{await navigator.clipboard.writeText(plain);}
  catch(_){
    const t=document.createElement('textarea');
    t.value=plain;t.style.cssText='position:fixed;opacity:0';
    document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);
  }
  const btn=document.getElementById(btnId);
  const orig=btn.textContent;
  btn.textContent='✅ 복사됨'; btn.classList.add('copied');
  setTimeout(()=>{btn.textContent=orig;btn.classList.remove('copied');},1500);
}

// ── AI 요약 ──
// 언어별 요약을 쌓아서 보여준다. session.summaries = { ko: '...', en: '...' }
// 예전 세션은 session.summary(문자열) 하나만 있는데, 그건 한국어 요약으로 간주해 옮겨준다.
function summariesOf(session){
  if(session.summaries) return session.summaries;
  return session.summary ? { ko: session.summary } : {};
}
function renderSummaries(session, areaId){
  const area=document.getElementById(areaId);
  if(!area) return;
  const map = summariesOf(session);
  const langs = Object.keys(map);
  if(!langs.length){ area.innerHTML=''; return; }
  area.innerHTML = langs.map(lang => {
    const name = langName[lang] || lang;
    const text = map[lang];
    return '<div style="font-size:11px;color:#555;margin:12px 0 4px;">'+name+' 요약</div>'
         + '<div class="summary-box">'+text.replace(/</g,'&lt;').replace(/\n/g,'<br>')+'</div>';
  }).join('');
}

// 매번 회의 전체를 다시 보내지 않는다. 이전 롤링 요약 + 그 이후 새로 쌓인
// 문단만 보내서, 모델이 "이전 요약과 새 내용을 종합한 최신 요약"과
// "지금 시점의 추천 발언"을 한 번에 만들어 돌려주게 한다.
function closeSuggestPanel(){
