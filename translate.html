// 최신 추천이 위로 오고, 이전 추천들은 구분선 아래로 계속 남는다(사라지지 않음)
function renderSuggestHistory(){
  const body = document.getElementById('suggestBody');
  if(!body) return;
  if(!suggestHistory.length){ body.innerHTML=''; return; }
  body.innerHTML = suggestHistory.slice().reverse().map((item, idx)=>{
    const latestTag = idx===0 ? ' · 최신' : '';
    return '<div class="sg-entry">'
      + '<div class="sg-time">'+item.time+latestTag+'</div>'
      + '<div class="sg-lang">🇰🇷 한국어</div><div class="sg-text">'+(item.ko||'').replace(/</g,'&lt;')+'</div>'
      + '<div class="sg-lang">🇺🇸 영어</div><div class="sg-text">'+(item.en||'').replace(/</g,'&lt;')+'</div>'
      + '</div>';
  }).join('<hr class="sg-divider">');
}

function buildTranscriptDelta(session, fromSegCount){
  const segs = pairSegments(session);
  const newSegs = segs.slice(fromSegCount);
  if(!newSegs.length) return { text: '', segCount: segs.length };
  let text = '';
  newSegs.forEach(sg=>{
    const srcTxt = (sg.src||[]).map(x=>x.text).join(' ').trim();
    const dstTxt = (sg.dst||[]).map(x=>x.text).join(' ').trim();
    if(srcTxt) text += '- 원문: '+srcTxt+'\n';
    if(dstTxt) text += '  번역: '+dstTxt+'\n';
  });
  return { text, segCount: segs.length };
}

async function suggestReply(){
  const key=document.getElementById('apiKey').value.trim();
  if(!key){ showErr('API Key를 입력해주세요.'); return; }
  if(!currentSession || (!currentSession.src.length && !currentSession.dst.length)){
    showErr('아직 대화 내용이 없습니다.'); return;
  }

  const btn = document.getElementById('suggestBtn');
  const panel = document.getElementById('suggestPanel');
  const body = document.getElementById('suggestBody');
  btn.disabled = true;
  panel.classList.remove('hidden');
  // 로딩 표시는 기존 기록 위에 얹기만 하고, 이전 추천은 그대로 둔다(사라지지 않게)
  renderSuggestHistory();
  body.insertAdjacentHTML('afterbegin', '<div class="suggest-loading" id="suggestLoadingRow">맥락을 살펴보는 중...</div>');

  const profile = document.getElementById('myProfile')?.value.trim() || '(제공되지 않음)';
  const meetingInfo = document.getElementById('meetingInfo')?.value.trim() || '(제공되지 않음)';
  const { text: deltaText, segCount } = buildTranscriptDelta(currentSession, suggestSegCount);
  const prevSummary = meetingRollingSummary || '(아직 없음 — 이번이 첫 요청)';

  const prompt = `당신은 실시간 통역 회의에 참석 중인 사용자를 돕는 어시스턴트입니다.

[내 프로필]
${profile}

[이번 회의 정보 및 내 입장]
${meetingInfo}

[지금까지 회의 요약(이전)]
${prevSummary}

[그 이후 새로 오간 대화]
${deltaText || '(새 내용 없음)'}

요청:
1. updated_summary: "이전 요약"과 "새로 오간 대화"를 종합해, 회의 전체 흐름을 압축한 최신 요약을 작성하세요. 다음 번엔 이 요약만 참고하면 되도록 핵심 논점과 합의/이견 사항 위주로 작성하세요.
2. suggestion_ko: 지금 이 시점에서 내 프로필과 이번 회의 입장에 맞게, 사용자가 다음에 할 만한 발언을 자연스러운 한국어로 하나 제안하세요.
3. suggestion_en: 같은 제안을 자연스러운 영어로도 작성하세요.

JSON 스키마에 맞춰서만 답하세요.`;

  try{
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+key, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        contents: [{ role:'user', parts:[{ text: prompt }] }],
        generationConfig: {
          responseMimeType: 'application/json',
          responseSchema: {
            type:'OBJECT',
            properties:{
              updated_summary: { type:'STRING' },
              suggestion_ko: { type:'STRING' },
              suggestion_en: { type:'STRING' },
            },
            required:['updated_summary','suggestion_ko','suggestion_en'],
          },
        },
      }),
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!text) throw new Error('응답 없음');
    const result = JSON.parse(text);

    meetingRollingSummary = result.updated_summary || meetingRollingSummary;
    suggestSegCount = segCount;

    suggestHistory.push({
      time: new Date().toTimeString().slice(0,5),
      ko: result.suggestion_ko || '',
      en: result.suggestion_en || '',
    });
    renderSuggestHistory();
  }catch(err){
    document.getElementById('suggestLoadingRow')?.remove();
    body.insertAdjacentHTML('afterbegin', '<div class="suggest-loading">추천 실패: '+(err?.message||err)+'</div>');
  }
  btn.disabled = false;
}

async function summarizeSession(session, areaId, btnId, langSelId){
  const key=document.getElementById('apiKey').value.trim();
  if(!key){alert('API Key를 번역 탭에 입력해주세요.');return;}
  const btn=document.getElementById(btnId);
  btn.disabled=true; btn.textContent='요약 중...';
  const area=document.getElementById(areaId);
  // 기존에 쌓인 다른 언어 요약이 있으면 그건 그대로 두고, 이번 언어 자리에만 로딩 표시를 추가한다
  if(!Object.keys(summariesOf(session)).length) area.innerHTML='<div class="summary-loading">Gemini가 요약 중입니다...</div>';
  else area.innerHTML += '<div class="summary-loading">Gemini가 요약 중입니다...</div>';

  const sumLang = document.getElementById(langSelId)?.value || 'ko';
  const sumLangName = langName[sumLang] || '한국어';
  const fullText=buildFullText(session, {summary:false});   // 요약 만들 때는 기존 요약 제외
  const prompt=`다음은 실시간 번역된 회의 내용입니다. 아래 항목으로 ${sumLangName} 회의록을 작성해주세요. 항목 제목을 포함해 전체를 ${sumLangName}로 작성하세요.

## 📌 핵심 요약 (3~5줄)
## ✅ Action Items
## 💡 주요 논의 사항
## ⚠️ 리스크 / 주의사항 (있는 경우만)

회의 내용:
${fullText.slice(0,8000)}`;

  try{
    const gRes=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${key}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
    });
    if(!gRes.ok){const errData=await gRes.json();throw new Error(errData.error?.message||'API 오류 '+gRes.status);}
    const gData=await gRes.json();
    const summary=gData.candidates?.[0]?.content?.parts?.[0]?.text||'요약 실패';
    if(!session.summaries) session.summaries = summariesOf(session);   // 예전 단일 요약을 옮겨 담는다
    session.summaries[sumLang] = summary;
    session.summary = summary;   // 하위 호환: 가장 최근 요약을 계속 여기에도 반영
    renderSummaries(session, areaId);
    if(session===currentSession){
      // 현재 세션 복사 버튼 표시
      const copyRow=document.getElementById('summaryCopyRow');
      if(copyRow) copyRow.style.display='block';
    }
    btn.textContent='재요약';
  }catch(err){
    area.innerHTML='<div class="summary-box" style="color:#ff453a">오류: '+err.message+'</div>';
    btn.textContent='AI 요약 생성';
  }
  btn.disabled=false;
}

function summarizeCurrent(){summarizeSession(currentSession,'summaryArea','summarizeBtn','summaryLang');}

// ── 모달 ──
let editMode = false;

function openModal(id){
  const session=getSessions().find(s=>s.id===id);
  if(!session)return;
  modalSession=session;
  editMode = false;
  document.getElementById('modalOverlay').classList.remove('hidden');
  document.getElementById('editSaveBar').classList.remove('show');
  document.getElementById('modalEditBtn').classList.remove('active');
  document.getElementById('modalEditBtn').textContent='✏️ 수정';
  renderModalBody();
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>fixModalBodyHeight());
  });
}

function fixModalBodyHeight(){
  const overlay=document.getElementById('modalOverlay');
  const body=document.getElementById('modalBody');
  const header=overlay.querySelector('.modal-header');
  const actions=overlay.querySelector('.modal-actions');
  const saveBar=document.getElementById('editSaveBar');
  const hh=header?header.getBoundingClientRect().height:0;
  const ah=actions?actions.getBoundingClientRect().height:0;
  const sh=(saveBar&&saveBar.classList.contains('show'))?saveBar.getBoundingClientRect().height:0;
  const available=window.innerHeight-hh-ah-sh;
  body.style.cssText='height:'+available+'px;overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:1rem;box-sizing:border-box;';
}

function renderModalBody(){
  const session=modalSession;

  document.getElementById('modalTitle').textContent=session.name;
  document.getElementById('modalTitle').classList.remove('hidden');
  document.getElementById('modalTitleInput').classList.add('hidden');
  document.getElementById('modalTitleInput').value=session.name;

  const body=document.getElementById('modalBody');
  body.className = editMode ? 'edit-mode' : '';
  body.innerHTML='<div style="font-size:12px;color:#555;margin-bottom:12px;">'+session.startTimeStr+(formatDuration(session.durationSec)?' · '+formatDuration(session.durationSec):'')+' · '+langPairLabel(session.lang)+'</div>';

  // 문단 단위로 원문·번역을 한 덩어리(카드)로 묶어 보여준다
  const segs=pairSegments(session);
  let html='';
  segs.forEach((sg,n)=>{
    const m=segMeta(sg);
    html+='<div class="seg-card">';
    html+='<div class="seg-head"><span class="seg-no">문단 '+(n+1)+'</span>'
        + (m.time?'<span class="seg-time">'+escapeHtml(m.time)+'</span>':'')
        + (scriptTag[m.lang]?'<span class="lang-tag">'+scriptTag[m.lang]+'</span>':'')
        + '</div>';
    if(sg.src.length){
      html+='<div class="seg-part"><div class="seg-label">원문</div>';
      sg.src.forEach(it=>{ html+=renderPara('src', session.src.indexOf(it), it, ''); });
      html+='</div>';
    }
    if(sg.dst.length){
      html+='<div class="seg-part"><div class="seg-label">번역</div>';
      sg.dst.forEach(it=>{ html+=renderPara('dst', session.dst.indexOf(it), it, 'ko'); });
      html+='</div>';
    }
    html+='</div>';
  });
  body.innerHTML+=html;

  // 기존 요약 있으면 표시
  if(Object.keys(summariesOf(session)).length){
    body.innerHTML+='<div style="font-size:11px;color:#555;margin-top:16px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;"><span>AI 요약</span><button class="copy-btn" id="copyModalSumBtn2" onclick="copySummary(\'modalSummaryArea\',\'copyModalSumBtn2\')">복사</button></div>';
    body.innerHTML+='<div id="modalSummaryArea"></div>';
    renderSummaries(session, 'modalSummaryArea');
  } else {
    body.innerHTML+='<div id="modalSummaryArea"></div>';
  }
}

function renderPara(type, idx, item, cls){
  const editable = editMode ? 'true' : 'false';
  const rtag = item.refined ? '<span class="refine-tag">다듬음</span>' : '';
  return '<div class="para'+(cls?' '+cls:'')+'" data-type="'+type+'" data-idx="'+idx+'"'
    +' data-seg="'+(item.seg!=null?escapeHtml(item.seg):'')+'"'
    +' data-lang="'+escapeHtml(item.lang||'')+'">'
    +'<span class="ts">'+escapeHtml(item.time||'')+'</span>'+rtag
    +'<button class="para-del" onclick="deletePara(this)">삭제</button>'
    +'<span class="pt" contenteditable="'+editable+'">'+escapeHtml(item.text)+'</span>'
    +'</div>';
}

function toggleEditMode(){
  if(!modalSession)return;
  editMode = !editMode;
  renderModalBody();
  const btn=document.getElementById('modalEditBtn');
  const titleSpan=document.getElementById('modalTitle');
  const titleInput=document.getElementById('modalTitleInput');
  const saveBar=document.getElementById('editSaveBar');
  if(editMode){
    btn.textContent='편집 중'; btn.classList.add('active');
    titleSpan.classList.add('hidden');
    titleInput.classList.remove('hidden');
    titleInput.value=modalSession.name;
    saveBar.classList.add('show');
  } else {
    btn.textContent='✏️ 수정'; btn.classList.remove('active');
    saveBar.classList.remove('show');
  }
}

function deletePara(btnEl){
  if(!confirm('이 문단을 삭제하시겠습니까?'))return;
  const paraEl = btnEl.closest('.para');
  paraEl.remove();
}

function saveEdit(){
  if(!modalSession)return;
  const session = modalSession;
  const titleInput = document.getElementById('modalTitleInput');
  const newName = titleInput.value.trim();
  if(newName) session.name = newName;

  // 본문에 남아있는 .para들을 다시 src/dst 배열로 재구성
  const body = document.getElementById('modalBody');
  const newSrc = [], newDst = [];
  body.querySelectorAll('.para').forEach(p=>{
    const type = p.dataset.type;
    const time = p.querySelector('.ts').textContent;
    const text = p.querySelector('.pt').textContent.trim();
    if(!text) return;
    const item = {time, text};
    if(p.dataset.seg!=='') item.seg = p.dataset.seg;   // 문단 대응 유지
    if(p.dataset.lang)     item.lang = p.dataset.lang;
    if(p.querySelector('.refine-tag')) item.refined = true;
    if(type==='src') newSrc.push(item);
    else newDst.push(item);
  });
  session.src = newSrc;
  session.dst = newDst;

  // localStorage 갱신
  const sessions = getSessions();
  const idx = sessions.findIndex(s=>s.id===session.id);
  if(idx>=0){ sessions[idx]=session; setSessions(sessions); }

  editMode=false;
  document.getElementById('editSaveBar').classList.remove('show');
  document.getElementById('modalEditBtn').textContent='✏️ 수정';
  document.getElementById('modalEditBtn').classList.remove('active');
  renderModalBody();
  renderSessionList();

  const btn=document.getElementById('modalEditBtn');
  btn.textContent='✅ 저장됨';
  setTimeout(()=>{btn.textContent='✏️ 수정';},1200);
}

function cancelEdit(){
  editMode=false;
  document.getElementById('editSaveBar').classList.remove('show');
  document.getElementById('modalEditBtn').textContent='✏️ 수정';
  document.getElementById('modalEditBtn').classList.remove('active');
  renderModalBody();
}

function summarizeModal(){
  if(!modalSession)return;
  summarizeSession(modalSession,'modalSummaryArea','modalSumBtn','summaryLangModal');
}

function closeModal(){
  document.getElementById('modalOverlay').classList.add('hidden');
  modalSession=null;
  editMode=false;
}
function closeModalOutside(e){if(e.target===document.getElementById('modalOverlay'))closeModal();}
</script>
